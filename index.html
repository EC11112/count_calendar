<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计数日历</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --border: #e5e7eb;
      --text: #1f2937;
      --text-soft: #6b7280;
      --text-faint: #9ca3af;
      --accent: #3b82f6;
      --hover: #f3f4f6;
      --today-ring: #111827;
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    /* v0.3.4：全局隐藏滚动条（视觉上干净，需要滚动时用滚轮/触摸） */
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { display: none; width: 0; height: 0; }

    .app {
      /* v0.3.2 重做：padding 0，.app 只是一个"装 .ui-wrap 的容器"，让 .ui-wrap 居中 */
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
      /* 不再 max-width: 1400px —— 4k 屏下被锁死，2k+ 大屏体验不到自适应 */
    }
    /* v0.3.2：把 3 panel（sidebar / main / stats）包进 .ui-wrap 容器，
       UI 整体宽度由 applyScreenRatio 算（全屏开关 + 方块大小上限），
       max-width + .app flex 居中，让 UI 居中，左右两侧空白是 .app 背景

       关键：min-width: 0 必须有，否则 .ui-wrap 作为 flex item 默认 min-width: auto = min-content，
       会被自己 grid 子项的 min-content（sidebar 240 + main min-content + stats 280 = ~900）撑大，
       JS 设的 max-width 失效，UI 始终撑满屏幕。*/
    .ui-wrap {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr) 280px;
      gap: 8px;
      padding: 8px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      height: 100vh;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      /* v0.3.2：padding 16 → 14，配合 .app gap 8 整体间距更紧凑 */
      padding: 14px;
      overflow: auto;
    }
    /* v0.3.2：main panel 必须 min-width: 0，否则 grid 1fr track 会被子 grid（季/年 14-21 列）撑大 */
    main.panel { min-width: 0; }

    /* v0.3.7：stats panel 顶部动作条(✏⚙),在 stats 标题之上,视觉上独立小区域 */
    .stats-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding: 4px 6px 10px;
      margin: -6px -6px 12px;
      border-bottom: 1px solid var(--border);
    }
    .stats-actions .header-icon-btn { width: 28px; height: 28px; font-size: 14px; }

    /* ===== Sidebar ===== */
    .sidebar { display: flex; flex-direction: column; }
    .sidebar h2 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-soft);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .project-list { list-style: none; margin: 0 0 12px; padding: 0; flex: 1; }
    .project-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }
    .project-item:hover { background: var(--hover); }
    .project-item.active { background: var(--hover); }
    /* v0.3.5：hidden project 灰显 + 名字加删除线 */
    .project-item.hidden-project .name { color: var(--text-faint); text-decoration: line-through; }
    .project-item.hidden-project .dot { opacity: 0.35; }
    /* v0.3.7：eye / del 按钮统一尺寸 22x22, 增大点击区, 防止误点
       v0.3.9：再加 edit 按钮 (项目编辑模式下显示) */
    .project-item .eye, .project-item .del, .project-item .edit {
      width: 22px; height: 22px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .project-item .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255,255,255,1), 0 0 0 3px rgba(0,0,0,0.06);
    }
    .project-item .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* v0.3.5：eye 按钮 — 切换项目显隐 */
    .project-item .eye {
      visibility: hidden;
      background: transparent;
      border: 0;
      color: var(--text-soft);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      width: 24px; height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .project-item:hover .eye { visibility: visible; }
    .project-item .eye:hover { background: var(--hover); color: var(--text); }
    /* v0.3.7：eye 按钮默认一直显示（常用操作,hover 高亮加深），不依赖 hover 才能看到
       之前 v0.3.5 默认 visibility:hidden,只 hover 才显示,用户经常找不到眼按钮 */
    .project-item .eye {
      visibility: visible;
      opacity: 0.5;
    }
    .project-item:hover .eye { opacity: 1; }
    .project-item .del {
      visibility: hidden;
      background: transparent;
      border: 0;
      color: var(--text-faint);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .project-item:hover .del { visibility: visible; }
    .project-item .del:hover { background: #fee2e2; color: #dc2626; }

    /* v0.3.9：项目编辑模式 —— sidebar 进入"项目编辑"模式后,所有项目显示 edit + del 按钮,不再显示 eye
       用 .project-list 上的 .edit-mode 类来切换,JS 在 renderProjects 里根据 state.projectEditMode 加 */
    .project-list.edit-mode .project-item .edit,
    .project-list.edit-mode .project-item .del { visibility: visible; }
    .project-list.edit-mode .project-item .eye { display: none; }
    /* v0.3.9：edit 按钮 —— 复用 eye/del 的样式,在编辑模式下显示 */
    .project-item .edit {
      visibility: hidden;
      background: transparent;
      border: 0;
      cursor: pointer;
      color: var(--text);
      font-size: 13px;
      margin-left: 2px;
    }
    .project-item .edit:hover { background: var(--hover); color: var(--text); }
    /* v0.3.9：del 按钮 2 段删除 —— 第一次点击进入"armed"态,按钮变红、字变"删除";
       第二次点击才真正执行删除,避免误删 */
    .project-item .del.armed {
      width: auto;
      min-width: 22px;
      padding: 0 5px;
      background: #fee2e2;
      color: #dc2626;
      font-size: 11px;
      font-weight: 500;
      visibility: visible;
    }

    .btn {
      width: 100%;
      padding: 8px 12px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--text-soft);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); background: #eff6ff; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent);
    }
    .btn-primary:hover { background: #2563eb; border-color: #2563eb; color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-soft); }
    .btn-ghost:hover { background: var(--hover); color: var(--text); }
    /* v0.3.9：项目编辑模式下的"退出编辑"按钮 (危险态) */
    .btn.btn-danger {
      background: #dc2626;
      color: #fff;
      border: 1px solid #dc2626;
      font-weight: 500;
    }
    .btn.btn-danger:hover { background: #b91c1c; border-color: #b91c1c; color: #fff; }

    /* ===== Calendar: header & view toggle ===== */
    .cal-header {
      display: flex;
      align-items: center;
      gap: 8px;
      /* v0.3.2：margin-bottom 16 → 8，main panel 顶部 header 块之前"占位"太大，跟 sidebar/stats 不对齐 */
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .nav-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .cal-header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cal-header button {
      padding: 4px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-soft);
      font-size: 14px;
      font-family: inherit;
    }
    .cal-header button:hover { background: var(--hover); color: var(--text); }

    .view-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .view-toggle button {
      padding: 4px 14px;
      background: var(--panel);
      border: 0;
      border-right: 1px solid var(--border);
      color: var(--text-soft);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      min-width: 48px;
    }
    .view-toggle button:last-child { border-right: 0; }
    .view-toggle button:hover { background: var(--hover); color: var(--text); }
    .view-toggle button.active {
      background: var(--accent);
      color: #fff;
    }

    /* ===== Header: settings (right side) ===== */
    .header-actions { position: relative; flex-shrink: 0; }
    .header-icon-btn {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-soft);
      font-size: 16px;
      padding: 0;
      font-family: inherit;
    }
    .header-icon-btn:hover { background: var(--hover); color: var(--text); }
    /* v0.3.6：编辑按钮激活态(蓝色高亮,跟 view-toggle active 一致) */
    .header-icon-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .header-icon-btn.active:hover { background: var(--accent); color: #fff; }
    /* v0.3.4+：设置菜单用 fixed 定位 + 打开时算位置
       - 之前 absolute 相对 .header-actions，拖滑条时 main panel 宽度变化 → 设置按钮位置变 → 弹窗跟着跑
       - 改成 fixed（相对视口） + 打开时根据按钮的 getBoundingClientRect() 算 top/right
       - 弹窗位置固定下来，滑条怎么拖弹窗都不动 */
    .settings-menu {
      position: fixed;
      /* top / right 由 JS 在打开时设置（基于设置按钮位置），关闭时清掉 */
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      z-index: 100;  /* fixed 在所有 panel 上面 */
      min-width: 220px;
    }
    .settings-menu.hidden { display: none; }
    /* v0.3.8：工时校验提示 toast
       - 工时类项目点击触发"日合计超 1 天"时,顶部居中淡入一个短提示,2.5s 自动消失
       - 不阻挡交互 (pointer-events: none) */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background: rgba(17, 24, 39, 0.92);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: 360px;
      text-align: center;
      line-height: 1.4;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.warn {
      background: rgba(220, 38, 38, 0.94);
    }
    /* v0.3.3：设置菜单对齐统一
       - label flex: 1 1 auto，左对齐，撑满左侧
       - input/select 固定 80px + margin-left: auto，右对齐，永远贴右
       - 所有行 label 起点和组件终点一致，视觉整齐
       v0.3.4：加 checkbox 样式，全屏开关贴右对齐 */
    .settings-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .settings-row > span:first-child {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .settings-row input[type="number"],
    .settings-row select {
      flex: 0 0 80px;
      width: 80px;
      margin-left: auto;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      text-align: center;
      outline: none;
      background: #fff;
    }
    .settings-row input[type="checkbox"] {
      flex: 0 0 80px;
      width: 20px;
      height: 20px;
      margin-left: auto;
      cursor: pointer;
      accent-color: var(--accent);
    }
    /* v0.3.4+：滑条调控日历面板宽度（贴右对齐 80px 槽，全屏开时变灰禁用） */
    .settings-row input[type="range"] {
      flex: 0 0 80px;
      width: 80px;
      margin-left: auto;
      padding: 0;
      background: transparent;
      cursor: pointer;
      accent-color: var(--accent);
    }
    .settings-row input[type="range"]:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .settings-row select { cursor: pointer; }
    .settings-row input[type="number"]:focus,
    .settings-row select:focus { border-color: var(--accent); }
    /* 行内的悬浮小注释（紧跟 label/title） */
    .settings-inline-hint {
      display: inline-block;
      margin-left: 4px;
      width: 14px;
      height: 14px;
      line-height: 14px;
      text-align: center;
      border-radius: 50%;
      background: var(--hover);
      color: var(--text-soft);
      font-size: 10px;
      cursor: help;
      user-select: none;
    }
    .settings-inline-hint:hover { background: var(--accent); color: #fff; }
    .settings-hint {
      margin: 8px 0 0;
      font-size: 11px;
      color: var(--text-faint);
      line-height: 1.4;
    }

    /* ===== Calendar: unified component (月/季/年共用) =====
       v0.3.4 重构：之前 .weekdays+.days (月) 和 .weekday-row+.day-strip (季/年) 两套，
       现在统一用 .cal-grid + .cal-cell，区别只是 cols（7 / weekCount*7 / 49）。
       月视图锁定 cols=7，季/年用 maxStripCols。
       字号公式统一：label = 0.5*cellSize cap 14，badge = 0.4*cellSize cap 10
       季/年不再有"小格子居中"和"大格子切月视图样式"的区分——所有格子都用月视图样式（日期右上+徽章左下）*/
    .cal-grid {
      display: grid;
      /* grid-template-columns 和 font-size 由 JS 根据视口和 cols 动态算 */
      gap: 2px;
      width: 100%;
      justify-content: center;
    }
    .cal-weekdays {
      color: var(--text-faint);
      text-align: center;
      margin-bottom: 3px;
      font-weight: 500;
    }
    .cal-weekdays span { padding: 1px 0; }
    .cal-weekdays span.wkn { color: #ef4444; }

    .cal-cell {
      aspect-ratio: 1 / 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 6px 8px;
      font-size: 14px;  /* fallback，JS 会按 cellSize 动态算 */
      color: var(--text-soft);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .cal-cell.blank { background: transparent; border: 0; cursor: default; }
    .cal-cell.future { cursor: not-allowed; opacity: 0.5; }
    /* v0.3.4：去掉奇怪的 font-weight: 600（加粗），所有 logged 格子都用细体 */
    .cal-cell.logged { color: #fff; font-weight: 400; }
    .cal-cell.logged[data-clicks="1"] { color: var(--text); }
    .cal-cell.logged[data-clicks="2"] { color: #fff; }
    .cal-cell.today { box-shadow: 0 0 0 2px var(--today-ring) inset; }
    /* v0.3.5：日期数字 z-index 比色条高 + text-shadow,确保彩色背景上可读 */
    .cal-cell-num {
      line-height: 1;
      position: relative;
      z-index: 2;
      text-shadow: 0 0 3px rgba(255,255,255,0.85), 0 0 1px rgba(255,255,255,0.95);
    }
    /* v0.3.6：编辑模式关闭时,cell 不显示 pointer,提示只读 */
    .cal-view.readonly-mode .cal-cell { cursor: default; }
    /* v0.3.5：多项目分段色条（z-index 1,在数字下面） */
    .cal-cell-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 1;
      pointer-events: none;
    }
    /* v0.3.5：badge 也得在色条之上 */
    .cal-cell-badge { z-index: 2; }
    /* 周末（未 logged）的日期数字红色，跟 weekday 行一致 */
    .cal-cell.wkn:not(.logged) .cal-cell-num { color: #ef4444; }
    .cal-cell-badge {
      position: absolute;
      bottom: 4px;
      left: 4px;
      font-size: 10px;  /* fallback，JS 动态算 */
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(255,255,255,0.35);
      color: inherit;
      line-height: 1.1;
    }
    .cal-cell.logged[data-clicks="2"] .cal-cell-badge { background: rgba(255,255,255,0.45); }

    /* v0.3.4+：旧 .strip-wrap / .weekday-row / .day-strip / .strip-day / .strip-day-num / .strip-day-badge 全部删除
       改用上面的统一 .cal-grid + .cal-cell + .cal-cell-num + .cal-cell-badge 组件
       - 月视图 cols=7，季视图 cols=weekCount*7，年视图 cols=49（统一一个 grid）
       - 所有格子都用月视图样式（日期右上 + 徽章左下），不再"小格子居中 / 大格子切月视图样式"
       - 字号公式统一 cap 14/10，方块大小与月视图一致时显示效果与月视图一致 */

    /* ===== Stats ===== */
    .stats h2 {
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stats h2 .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255,255,255,1), 0 0 0 3px rgba(0,0,0,0.06);
    }
    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .stat-label { font-size: 12px; color: var(--text-faint); margin-bottom: 4px; }
    .stat-value { font-size: 24px; font-weight: 600; }
    .stat-value .unit { font-size: 13px; color: var(--text-soft); margin-left: 4px; font-weight: 400; }
    .stat-sub { font-size: 12px; color: var(--text-soft); margin-top: 2px; }
    /* v0.3.5：多项目时,在 stat-card 底部加每个项目的小计 */
    .stat-breakdown {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-breakdown-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-soft);
    }
    .stat-breakdown-row .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .stat-breakdown-row .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stat-breakdown-row .val {
      color: var(--text);
      font-weight: 500;
    }

    .empty { color: var(--text-faint); text-align: center; padding: 32px 8px; }

    /* ===== Modal ===== */
    .modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal.hidden { display: none; }
    .modal-content {
      background: var(--panel);
      border-radius: 12px;
      padding: 20px;
      width: 320px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }
    .modal-content h3 { margin: 0 0 16px; font-size: 16px; }
    .modal-content label {
      display: block;
      font-size: 12px;
      color: var(--text-soft);
      margin-bottom: 12px;
    }
    .modal-content input[type="text"] {
      width: 100%;
      margin-top: 4px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .modal-content input[type="text"]:focus { border-color: var(--accent); }
    /* v0.3.7：项目类型选择 (工时/非工时) */
    .kind-picker {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }
    .kind-option {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      user-select: none;
    }
    .kind-option input[type="radio"] {
      cursor: pointer;
      accent-color: var(--accent);
    }
    .kind-option .kind-hint {
      color: var(--text-faint);
      font-size: 11px;
      margin-left: 2px;
    }
    .color-picker {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    .swatch {
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
    }
    .swatch.selected { border-color: var(--text); transform: scale(1.1); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-actions button { width: auto; padding: 6px 14px; }

    /* ===== Responsive ===== */
    /* v0.3.3：窄屏（手机/小平板竖屏）3 panel 改上下堆叠，避免横屏 3 列挤压到日历看不清
       兼容当前 .ui-wrap 结构 —— grid-template-columns 改 1fr，3 panel 自然竖排
       .app 改 min-height: 100vh，height: auto，让 body 能滚
       max-width 由 JS 算（堆叠模式下也用同公式：appW - 32），保证两侧 16px 边距 */
    @media (max-width: 900px) {
      .app {
        height: auto;
        min-height: 100vh;
        align-items: flex-start;
      }
      .ui-wrap {
        grid-template-columns: 1fr;
        grid-auto-rows: auto;
        height: auto;
      }
      .panel { max-height: none; }
    }
    /* v0.3.2：竖屏下屏占比设置隐藏 —— 竖屏本来 main panel 就窄，屏占比再缩就崩 */
    @media (orientation: portrait) {
      .screen-ratio-row { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="ui-wrap">
    <aside class="panel sidebar">
      <h2>项目</h2>
      <ul class="project-list" id="project-list"></ul>
      <button class="btn" id="add-project">+ 新建项目</button>
      <!-- v0.3.9：项目编辑模式切换 (在 normal 是"编辑项目" / 灰边框,在 edit mode 是"退出编辑" / 红色) -->
      <button class="btn" id="toggle-edit-projects" style="margin-top:8px;">编辑项目</button>
    </aside>

    <main class="panel">
      <div class="cal-header">
        <div class="nav-group">
          <button id="prev-month" title="上一段">‹</button>
          <h1 id="month-label"></h1>
          <button id="next-month" title="下一段">›</button>
          <button id="today-btn" title="跳到今天">今天</button>
        </div>
        <div class="view-toggle" id="view-toggle" role="tablist">
          <button data-view="month"   title="月视图（单月，7 列）">月</button>
          <button data-view="quarter" title="季度视图（连续 3 个月，列数 = 星期数 × 7）">季</button>
          <button data-view="year"    title="年视图（连续 12 个月，列数 = 星期数 × 7）">年</button>
        </div>
        <div class="settings-menu hidden" id="settings-menu">
          <label class="settings-row">
            <span>
              星期数
              <span class="settings-inline-hint" title="季/年视图每行几周（1 周 = 7 列）。月视图固定 1 周不生效。范围 1-7，默认 5。">?</span>
            </span>
            <input type="number" id="max-cols-input" min="1" max="7" step="1">
          </label>
          <label class="settings-row">
            <span>
              方块大小上限
              <span class="settings-inline-hint" title="日期格子最大边长（px）。所有视图通用 cap，大屏防格子过大。范围 40-200，默认 80。">?</span>
            </span>
            <input type="number" id="max-cell-input" min="40" max="200" step="4">
          </label>
          <label class="settings-row screen-ratio-row">
            <span>
              全屏
              <span class="settings-inline-hint" title="开：日历撑满视口宽度（留 16px 边距）。关：由下方「日历宽度」滑条控制。竖屏强制开。">?</span>
            </span>
            <input type="checkbox" id="fullscreen-input">
          </label>
          <!-- v0.3.4+：滑条调控日历面板 mainW，全屏开时灰色禁用
               min = 7 × 方块上限 × 1.1（一周大小 + 10% 余量）
               max = 视口 × 0.7
               默认 = 当前视图的 cellUiW mainW（用户没拖过就一直自动算） -->
          <label class="settings-row screen-ratio-row">
            <span>
              日历宽度
              <span class="settings-inline-hint" title="非全屏时手动调节日历面板宽度（1 周大小 ~ 视口 70%）。全屏开时该选项无效。">?</span>
            </span>
            <input type="range" id="cal-width-input" min="0" max="0" step="10">
          </label>
          <p class="settings-hint">日期格子永远正方形；方块上限 = 最大 cellSize，实际按面板宽度算。</p>
        </div>
      </div>

      <!-- v0.3.4+：月/季/年统一 .cal-view 容器
           - 内部两个 .cal-grid：cal-weekdays（星期行）+ cal-days（日期网格）
           - 区别只是 cols：月=7，季=weekCount*7，年=49
           - JS 在 renderCalendarView 里统一填格子 -->
      <div class="cal-view" id="cal-view">
        <div class="cal-grid cal-weekdays" id="cal-weekdays"></div>
        <div class="cal-grid cal-days" id="cal-days"></div>
      </div>
    </main>

    <section class="panel stats">
      <div class="stats-actions">
        <button id="edit-toggle" class="header-icon-btn" title="编辑模式：关时点击日历不会修改记录，开时点击切换 0 → 半天 → 整天" aria-label="编辑模式">✏</button>
        <button id="settings-btn" class="header-icon-btn" title="设置" aria-label="设置">⚙</button>
      </div>
      <h2 id="stats-title">统计</h2>
      <div id="stats-body"></div>
    </section>
    </div><!-- /.ui-wrap -->

  <div class="modal hidden" id="project-modal">
    <div class="modal-content">
      <h3 id="project-modal-title">新建项目</h3>
      <label>项目名称
        <input type="text" id="project-name" maxlength="20" placeholder="例如：学习、跑步">
      </label>
      <div class="color-picker" id="color-picker"></div>
      <div class="kind-picker">
        <label class="kind-option">
          <input type="radio" name="project-kind" value="hours" checked>
          <span>工时类<span class="kind-hint">（半天/整天）</span></span>
        </label>
        <label class="kind-option">
          <input type="radio" name="project-kind" value="days">
          <span>非工时<span class="kind-hint">（只计天）</span></span>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancel-project">取消</button>
        <button class="btn btn-primary" id="confirm-project">确定</button>
      </div>
    </div>
  </div>

  <!-- v0.3.8：通用 toast 提示 (工时校验等一次性反馈) -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    'use strict';

    // ========== Config ==========
    const STORAGE_KEY = 'count_calendar_v2';
    const HOURS_PER_DAY = 8;
    const COLORS = [
      '#ef4444', '#f59e0b', '#eab308', '#10b981',
      '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899'
    ];
    const DEFAULT_PROJECTS = [
      { id: 'p_default_study', name: '学习', color: '#3b82f6' },
      { id: 'p_default_sport', name: '运动', color: '#10b981' },
      { id: 'p_default_work',  name: '工作', color: '#f59e0b' }
    ];
    const VIEW_STEP  = { month: 1, quarter: 3, year: 12 };
    const VIEW_COUNT = { month: 1, quarter: 3, year: 12 };
    const WEEKDAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];

    // ========== Strip layout (季/年视图自适应) ==========
    // 原则：
    //  1) 单行渲染列数必须是 7 的倍数（保证星期整除）
    //  2) 日期块必须正方形（aspect-ratio: 1/1）
    //  3) 格子像素必须 >= 41（1080*0.8/21 的舒适下限）
    //  4) 在保证 (3) 的前提下尽量多列填满屏幕
    // 算法：从 MAX 往下试 7 的倍数，第一个 cellSize >= 41 的列数即为最优
    // MAX_STRIP_COLS 默认 35（≈ 49 * 3/4，即 3/4 个完整星期数），可由用户在右上角设置菜单里调
    const DEFAULT_MAX_STRIP_COLS = 35;
    const MIN_CELL_SIZE     = 41;        // 1080 * 0.8 / 21 ≈ 41，下限
    const STRIP_GAP         = 2;
    const MIN_STRIP_COLS    = 7;
    // 字体算法（v0.3.4+ 统一 cap 14/10）：
    //  - v0.3.0 调小：0.5/0.4 配 cap 28/18；cell=41 时 label≈21，cell=80 时 label≈28（cap）
    //  - v0.3.4+：把 cap 降到 14/10，跟月视图 CSS 写死的 14/10 完全一致
    //  - 这样季/年视图方块大小与月视图一致时，显示效果跟月视图一模一样
    //  - cell=20 时 label = max(10, min(14, 0.5*20=10)) = 10；cell=28+ 时全部 cap 14
    //  - cell=20 时 badge = max(8, min(10, 0.4*20=8)) = 8；cell=25+ 时全部 cap 10
    //  - 月视图也不写死 CSS 了，跟季/年走同一公式（cellSize 算法也用统一的 cap）
    const LABEL_FONT_RATIO  = 0.5;       // weekday / date 数字 / 月份标签
    const BADGE_FONT_RATIO  = 0.4;       // "半" / "整" 徽章
    const MIN_LABEL_FONT    = 10;        // cell≤20 时的下限
    const MAX_LABEL_FONT    = 14;        // 跟月视图 CSS 写死的 14px 一致
    const MIN_BADGE_FONT    = 8;         // cell≤20 时的下限
    const MAX_BADGE_FONT    = 10;        // 跟月视图 CSS 写死的 10px 一致
    // 徽章渲染阈值（v0.3.0 改公式）：
    //  - 旧值 35 在 1080p 半屏竖屏触发，但小格里 "半" 跟日期数字会重叠
    //  - 用户公式 cellSize > 字体px * 4：参考最小字号 14 * 4 = 56，作为"能放下 4 个字"的最小宽度
    //  - 56 也正好是 1080p 全屏能舒服触发的下限，4k 大屏远超
    const REF_FONT_FOR_BADGE = 14;       // 参考最小字号
    const BADGE_MIN_CELLSIZE = REF_FONT_FOR_BADGE * 4;  // = 56
    function shouldShowBadge(cellSize) { return cellSize >= BADGE_MIN_CELLSIZE; }

    function calculateStripLayout(containerWidth) {
      // v0.3.4+：季/年视图选列算法（从 maxStripCols 向下试 7 的倍数，第一个 cellSize >= 41 的列数即为最优）
      // 月视图不走这里，renderSingleMonth 直接传 cols=7
      const maxCols = state.maxStripCols || DEFAULT_MAX_STRIP_COLS;
      const maxAligned = Math.floor(maxCols / 7) * 7;
      for (let cols = maxAligned; cols >= MIN_STRIP_COLS; cols -= 7) {
        const cellSize = calcCellSize(containerWidth, cols);
        if (cellSize >= MIN_CELL_SIZE) return { cols, cellSize };
      }
      // 极窄屏兜底：用 7 列（cellSize 可能 < 41）
      return { cols: MIN_STRIP_COLS, cellSize: calcCellSize(containerWidth, MIN_STRIP_COLS) };
    }
    // v0.3.4+：统一所有视图的格子大小算法
    // - raw = (mainW - gap*(cols-1)) / cols
    // - cellSize = min(raw, maxCellSize) cap
    // - 下限 20px（cellSize 再小就基本看不清了）
    function calcCellSize(mainW, cols) {
      const gap = STRIP_GAP;  // 2px（v0.3.4+ 统一月/季/年）
      const raw = Math.floor((mainW - gap * (cols - 1)) / cols);
      const cap = state.maxCellSize || 80;
      return Math.max(20, Math.min(raw, cap));
    }
    function calcLabelFontSize(cellSize) {
      return Math.max(MIN_LABEL_FONT, Math.min(MAX_LABEL_FONT, Math.round(cellSize * LABEL_FONT_RATIO)));
    }
    function calcBadgeFontSize(cellSize) {
      return Math.max(MIN_BADGE_FONT, Math.min(MAX_BADGE_FONT, Math.round(cellSize * BADGE_FONT_RATIO)));
    }
    function measureMainWidth() {
      // v0.3.4+：月/季/年统一读 main panel content 宽度（clientWidth - 32 padding+border）
      // 真实窄屏（如 689px 竖屏 main 95px）也要如实返回，让 cellSize 走 min(rawCell, maxCellSize) 自动缩
      // v0.3.2 修复：去掉 Math.max(..., 280) 兜底 —— 那是为了初始化时 main.panel 还没布局的应急，
      // 实际场景下 main.panel 一定有 clientWidth，这个兜底反而让窄屏 cellSize 永远按 280 算、看起来"maxCellSize 限制丢了"
      const panel = document.querySelector('main.panel');
      const inner = panel ? panel.clientWidth - 32 : 280;
      return Math.max(inner, 60);  // 极端窄（main < 92）兜底 60px，避免 cellSize 算出 0/负数
    }

    // ========== State ==========
    let state = {
      projects: [],
      currentProjectId: null,
      logs: {},
      viewYear: null,
      viewMonth: null,
      viewMode: 'month',
      maxStripCols: DEFAULT_MAX_STRIP_COLS,
      // v0.3.4：方块大小上限（px），所有视图通用 cap（月/季/年 cellSize 都不超过这个）
      maxCellSize: 80,
      // v0.3.4：全屏开关（true=UI 撑满 viewport - 32，false=UI 刚好包住日历年历 cellSize*7*weekCount）
      // 替代 v0.3.0-v0.3.3 的 5 档屏占比
      fullscreen: true,
      // v0.3.4+：日历面板 mainW 滑条值（null = 自动用 cellUiW 公式）
      // 范围 7*maxCellSize*1.1 ~ appW*0.7，step 10
      calPanelWidth: null
      // v0.3.9.x：项目编辑模式 projectEditMode 不放在 state 里 —— 它是临时 UI 状态,
      //   刷新/切换 active 自动退出,不该持久化. 改为模块级 let _projectEditMode
    };

    // v0.3.0-v0.3.3 旧版屏占比档位（仅 migration 用，把旧值映射到新全屏开关）
    const SCREEN_RATIO_OPTIONS = [1.0, 0.83, 0.75, 0.66, 0.5];

    // ========== Storage ==========
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = Object.assign(state, parsed);
        }
      } catch (e) {
        console.warn('loadState failed:', e);
      }
      if (!Array.isArray(state.projects) || state.projects.length === 0) {
        state.projects = DEFAULT_PROJECTS.slice();
      }
      if (!state.currentProjectId && state.projects[0]) {
        state.currentProjectId = state.projects[0].id;
      }
      // v0.3.5：每个 project 加 visible 字段（默认 true），老数据 migration
      state.projects.forEach(p => { if (p.visible === undefined) p.visible = true; });
      // v0.3.7：每个 project 加 kind 字段（默认 'hours' 工时类），老数据 migration
      state.projects.forEach(p => { if (p.kind === undefined) p.kind = 'hours'; });
      // v0.3.9.1：项目编辑模式 (projectEditMode) 不再入 state —— 删掉老数据里的残留字段
      //   之前的版本误把 _projectEditMode 当成持久字段存了 localStorage,这次彻底切到模块变量
      delete state.projectEditMode;
      if (!state.logs || typeof state.logs !== 'object') state.logs = {};
      const now = new Date();
      if (state.viewYear == null || state.viewYear < 1900) state.viewYear = now.getFullYear();
      if (state.viewMonth == null || state.viewMonth < 0 || state.viewMonth > 11) state.viewMonth = now.getMonth();
      if (!VIEW_STEP[state.viewMode]) state.viewMode = 'month';
      // maxStripCols 必须是 7 的倍数且 >= 7
      if (typeof state.maxStripCols !== 'number' || state.maxStripCols < 7) {
        state.maxStripCols = DEFAULT_MAX_STRIP_COLS;
      } else {
        state.maxStripCols = Math.min(49, Math.floor(state.maxStripCols / 7) * 7);
      }
      // v0.3.4：maxCellSize 改成所有视图通用 cap（月/季/年），范围 40-200
      if (typeof state.maxCellSize !== 'number' || state.maxCellSize < 40) {
        state.maxCellSize = 80;
      } else if (state.maxCellSize > 200) {
        state.maxCellSize = 200;
      } else {
        state.maxCellSize = Math.round(state.maxCellSize);
      }
      // v0.3.4：从旧版 screenRatio migration 到 fullscreen 开关
      // 旧 screenRatio=1.0 → fullscreen=true（保持满宽体验）
      // 旧 screenRatio<1.0 → fullscreen=false（关全屏，UI 缩到刚好包住日历年历）
      if (typeof state.fullscreen !== 'boolean') {
        if (typeof state.screenRatio === 'number' && state.screenRatio > 0) {
          // 旧值迁移：先归一化到合法档位
          const normalized = (SCREEN_RATIO_OPTIONS || [1.0, 0.83, 0.75, 0.66, 0.5])
            .reduce((best, opt) => Math.abs(state.screenRatio - opt) < Math.abs(state.screenRatio - best) ? opt : best, 1.0);
          state.fullscreen = (normalized === 1.0);
        } else {
          state.fullscreen = true;
        }
        // 清掉旧字段避免下次 migration 误判
        delete state.screenRatio;
      }
      // v0.3.4+：calPanelWidth 必须是 7*maxCellSize*1.1 ~ appW*0.7 之间的有效值，否则 null
      // （存进 localStorage 时可能是某个历史值，加载时按当前约束重新校准）
      if (typeof state.calPanelWidth !== 'number' || state.calPanelWidth < 100) {
        state.calPanelWidth = null;
      }
      // v0.3.6：editMode 默认 false（只读），防止误触添加 log
      if (typeof state.editMode !== 'boolean') state.editMode = false;
      saveState();
    }
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('saveState failed:', e);
      }
    }

    // ========== Helpers ==========
    function pad2(n) { return String(n).padStart(2, '0'); }
    function dateStr(y, m, d) { return `${y}-${pad2(m+1)}-${pad2(d)}`; }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => (
        { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
      ));
    }
    function hexToRgba(hex, a) {
      const v = hex.replace('#','');
      const n = parseInt(v, 16);
      return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
    }
    function getProject(id) { return state.projects.find(p => p.id === id); }
    // v0.3.5：所有可见项目（visible !== false）。日历/统计只看这些
    function getVisibleProjects() {
      return state.projects.filter(p => p.visible !== false);
    }
    function getClicks(projectId, ds) {
      return (state.logs[projectId] || {})[ds] || 0;
    }
    // v0.3.8：计算某日工时类项目合计 (跨所有 hours-kind 项目,不论 visible)
    // 半天 = 0.5, 整天 = 1.0; 非工时类不计入
    // excludeProjId 可选: 用于"换算到当前点击之后"时把 active project 当前贡献排除掉
    function getDayHoursTotal(ds, excludeProjId) {
      let total = 0;
      state.projects.forEach(p => {
        if (p.kind !== 'hours') return;
        if (excludeProjId && p.id === excludeProjId) return;
        const c = getClicks(p.id, ds);
        if (c === 1) total += 0.5;
        else if (c === 2) total += 1.0;
      });
      return total;
    }
    function setClicks(projectId, ds, clicks) {
      if (!state.logs[projectId]) state.logs[projectId] = {};
      if (clicks <= 0) delete state.logs[projectId][ds];
      else state.logs[projectId][ds] = clicks;
      saveState();
    }
    function addMonths(y, m, delta) {
      const total = y * 12 + m + delta;
      return { y: Math.floor(total / 12), m: ((total % 12) + 12) % 12 };
    }
    // 一年中第几天（0-based，1/1 = 0）。用于 strip 中的位置
    function dayOfYear(y, m, d) {
      const start = new Date(y, 0, 1);
      const cur = new Date(y, m, d);
      return Math.round((cur - start) / 86400000);
    }

    // ========== Render: Sidebar ==========
    // v0.3.9：项目编辑模式 —— _projectEditMode=true 时,所有项目右侧只显示 edit + del 按钮(替代 eye)
    // v0.3.9.1：_projectEditMode 是模块级变量 (不入 state,不入 localStorage)
    //   - 刷新页面 / 切换 active 项目 都自动退出
    //   - 进入: 点 sidebar 底部的"编辑项目"按钮(变成红色"退出编辑")
    //   - 退出: 再点一次底部按钮,或刷新/切换 active
    //   - 平时 (_projectEditMode=false): 每个项目只显示 eye (可见性切换)
    function renderProjects() {
      const list = document.getElementById('project-list');
      list.innerHTML = '';
      // v0.3.9：edit-mode 类控制按钮显隐 (CSS 里有 .project-list.edit-mode .eye { display: none } 等)
      list.classList.toggle('edit-mode', !!_projectEditMode);
      if (state.projects.length === 0) {
        list.innerHTML = '<li style="color:var(--text-faint);font-size:12px;padding:8px 10px;">还没有项目</li>';
        renderSidebarBottomButton();
        return;
      }
      state.projects.forEach(p => {
        const li = document.createElement('li');
        const isActive = p.id === state.currentProjectId;
        const isHidden = p.visible === false;
        li.className = 'project-item' + (isActive ? ' active' : '') + (isHidden ? ' hidden-project' : '');
        // v0.3.9：根据 _projectEditMode 决定渲染哪些按钮
        //   - normal: eye (显隐)
        //   - edit mode: edit (编辑项目) + del (删除,2 段式)
        let buttonsHtml;
        if (_projectEditMode) {
          buttonsHtml = `
            <button class="edit" data-id="${p.id}" title="编辑项目">✎</button>
            <button class="del" data-id="${p.id}" title="删除项目 (再点一次确认)">×</button>
          `;
        } else {
          buttonsHtml = `
            <button class="eye" data-id="${p.id}" title="${isHidden ? '显示项目' : '隐藏项目'}">${isHidden ? '○' : '●'}</button>
          `;
        }
        li.innerHTML = `
          <span class="dot" style="background:${p.color}"></span>
          <span class="name">${escapeHtml(p.name)}</span>
          ${buttonsHtml}
        `;
        li.addEventListener('click', (e) => {
          // 任何按钮 (eye/edit/del) 都不触发 active 切换
          if (e.target.closest('button')) return;
          state.currentProjectId = p.id;
          // v0.3.9.1：切换 active 项目时自动退出编辑模式
          //   理由: "切 active" 意味着"我要用这个项目了",跟"还在编辑模式"语义冲突
          //   防止用户切到 B 项目后还在 edit 模式,一不小心点了 B 的 del/edit
          if (_projectEditMode) _projectEditMode = false;
          saveState();
          renderAll();
        });
        if (_projectEditMode) {
          // v0.3.9：edit 按钮 —— 复用新建项目弹窗,预填当前名称/颜色/类型
          li.querySelector('.edit').addEventListener('click', (e) => {
            e.stopPropagation();
            openModalForEdit(p.id);
          });
          // v0.3.9：del 按钮 2 段式删除 —— 第一次变红"删除",第二次才真删
          //  - 不再弹 confirm() (之前每次都弹,体验割裂)
          //  - 切换到其它项目 / 退出 edit mode / 重新渲染都会清掉 armed 状态
          li.querySelector('.del').addEventListener('click', (e) => {
            e.stopPropagation();
            const btn = e.currentTarget;
            if (btn.classList.contains('armed')) {
              deleteProject(p.id);
            } else {
              btn.classList.add('armed');
              btn.textContent = '删除';
            }
          });
        } else {
          // v0.3.5：eye 按钮 —— 切换显隐。visible 时显示实心圆(睁开),hidden 时显示空心圆(关闭)
          // v0.3.7：bug 修复 — 用 !p.visible (当前状态) 而不是 !isHidden (闭包变量)
          li.querySelector('.eye').addEventListener('click', (e) => {
            e.stopPropagation();
            p.visible = !p.visible;
            saveState();
            renderAll();
          });
        }
        list.appendChild(li);
      });
      // v0.3.9：底部按钮文字/样式切换 (正常 "编辑项目" / edit mode 红色 "退出编辑")
      renderSidebarBottomButton();
    }
    // v0.3.9：sidebar 底部"编辑项目"/"退出编辑"按钮的状态切换
    // v0.3.9.1：读模块级 _projectEditMode (不再是 state.projectEditMode)
    function renderSidebarBottomButton() {
      const btn = document.getElementById('toggle-edit-projects');
      if (!btn) return;
      if (_projectEditMode) {
        btn.textContent = '退出编辑';
        btn.classList.add('btn-danger');
      } else {
        btn.textContent = '编辑项目';
        btn.classList.remove('btn-danger');
      }
    }
    // v0.3.9：删除项目 (从 .del click handler 抽出来,删除逻辑独立)
    function deleteProject(id) {
      const proj = getProject(id);
      if (!proj) return;
      delete state.logs[id];
      state.projects = state.projects.filter(x => x.id !== id);
      if (state.currentProjectId === id) {
        state.currentProjectId = state.projects[0]?.id || null;
      }
      saveState();
      renderAll();
    }

    // ========== Render: Header (label + view toggle + containers) ==========
    function renderHeader() {
      document.querySelectorAll('#view-toggle button').forEach(b => {
        b.classList.toggle('active', b.dataset.view === state.viewMode);
      });
      // v0.3.6：编辑按钮 active 态 + cal-view readonly 模式 class
      const editBtn = document.getElementById('edit-toggle');
      if (editBtn) editBtn.classList.toggle('active', state.editMode);
      const calView = document.getElementById('cal-view');
      if (calView) calView.classList.toggle('readonly-mode', !state.editMode);

      let label = '';
      if (state.viewMode === 'month') {
        label = `${state.viewYear} 年 ${state.viewMonth + 1} 月`;
      } else if (state.viewMode === 'quarter') {
        const start = { y: state.viewYear, m: state.viewMonth };
        const end = addMonths(state.viewYear, state.viewMonth, 2);
        if (start.y === end.y) {
          label = `${start.y} 年 ${start.m + 1}–${end.m + 1} 月`;
        } else {
          label = `${start.y}.${start.m + 1} – ${end.y}.${end.m + 1}`;
        }
      } else {
        label = `${state.viewYear} 年`;
      }
      document.getElementById('month-label').textContent = label;

      // v0.3.4+：月/季/年统一 .cal-view，不再按 viewMode 切换显隐
    }

    // ========== Render: Unified calendar view (月/季/年共用) ==========
    // v0.3.4+ 重构：之前月/季/年是两套不同组件（.weekdays+.days vs .weekday-row+.day-strip+.strip-day），
    // 现在统一用 .cal-grid + .cal-cell，区别只是 cols：
    //   - 月视图：cols 锁定 7（一周一行）
    //   - 季视图：cols = state.maxStripCols（7 的倍数，由 calculateStripLayout 算出）
    //   - 年视图：cols = state.maxStripCols（7 的倍数，7 周一行 = 49 比较自然，但跟随用户设置）
    // 字号公式也统一 cap 14/10，cellSize 与月视图一致时显示效果一致
    function renderCalendarView(months, cols) {
      const mainW = measureMainWidth();
      const cellSize = calcCellSize(mainW, cols);
      const gridTemplate = `repeat(${cols}, ${cellSize}px)`;
      const labelFont = calcLabelFontSize(cellSize);
      const badgeFont = calcBadgeFontSize(cellSize);
      // v0.3.0：徽章渲染条件 cellSize >= 56（能放下 4 个 14px 字宽），小格里 "半" 跟日期数字会重叠
      const useBadge = shouldShowBadge(cellSize);
      const now = new Date();
      const todayKey = dateStr(now.getFullYear(), now.getMonth(), now.getDate());
      const proj = getProject(state.currentProjectId);

      // 星期行：按 weeksPerRow 重复 日 一 二 三 四 五 六
      const weeksPerRow = cols / 7;
      const weekdayLabels = [];
      for (let i = 0; i < weeksPerRow; i++) {
        for (let d = 0; d < 7; d++) weekdayLabels.push(WEEKDAY_NAMES[d]);
      }
      const wdRow = document.getElementById('cal-weekdays');
      wdRow.innerHTML = '';
      wdRow.style.gridTemplateColumns = gridTemplate;
      wdRow.style.fontSize = `${labelFont}px`;
      weekdayLabels.forEach((label, i) => {
        const span = document.createElement('span');
        const colInWeek = i % 7;
        if (colInWeek === 0 || colInWeek === 6) span.className = 'wkn';
        span.textContent = label;
        wdRow.appendChild(span);
      });

      // 日期网格：第一个月加前缀空对齐到对应周几，后续月份紧接上个月最后一天 → 不会"跳星期"
      const daysEl = document.getElementById('cal-days');
      daysEl.innerHTML = '';
      daysEl.style.gridTemplateColumns = gridTemplate;
      daysEl.style.fontSize = `${labelFont}px`;

      const m0 = months[0];
      const firstDow = new Date(m0.y, m0.m, 1).getDay();
      const cellData = [];
      for (let i = 0; i < firstDow; i++) cellData.push({ blank: true });
      for (const { y, m } of months) {
        const lastDate = new Date(y, m + 1, 0).getDate();
        for (let d = 1; d <= lastDate; d++) {
          cellData.push({ y, m, d, ds: dateStr(y, m, d), blank: false });
        }
      }
      cellData.forEach((c, i) => { c.colIndex = i; });
      // 末尾补空让 cellData 长度 = cols 的倍数（最后一行 weekday 标签也填满，对齐列）
      while (cellData.length % cols !== 0) cellData.push({ blank: true, colIndex: cellData.length });

      // v0.3.5：cellData.forEach 用 todayKey 传就行,proj 不再传,buildCalCell 内部用 getVisibleProjects()
      const _ = proj;  // 保留参数兼容性,实际不用
      cellData.forEach(c => daysEl.appendChild(buildCalCell(c, todayKey, { useBadge, badgeFont })));
    }

    // v0.3.5：buildCalCell 重写为多项目版本
    // - 收集所有 visible project 在该日期的 log
    // - N=0: 空白格;N=1: 单色整格(整=实色,半=0.4 alpha);N>=2: 横向分段色条(每项目一竖条,保留各项目原色)
    // - 数字 z-index 高于色条 + text-shadow,彩色背景上可读
    // - 单击仍然只 toggle active project 的 log(简单点,复杂的多项目编辑后面再说)
    function buildCalCell(cellData, todayKey, opts) {
      const { useBadge, badgeFont } = opts || {};
      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      if (cellData.blank) {
        cell.classList.add('blank');
        return cell;
      }
      const { y, m, d, ds, colIndex } = cellData;
      cell.setAttribute('role', 'button');
      cell.setAttribute('tabindex', '0');
      cell.dataset.date = ds;
      cell.setAttribute('aria-label', `${y}年${m+1}月${d}日`);
      // 周末标记（按 cell 在 grid 中的实际列位置）
      const colInWeek = ((colIndex % 7) + 7) % 7;
      if (colInWeek === 0 || colInWeek === 6) cell.classList.add('wkn');
      if (ds === todayKey) cell.classList.add('today');
      if (ds > todayKey) cell.classList.add('future');

      // v0.3.5：收集所有可见项目在该日期的 log
      const visibleProjects = getVisibleProjects();
      const logs = visibleProjects
        .map(p => ({ project: p, clicks: getClicks(p.id, ds) }))
        .filter(l => l.clicks > 0);

      if (logs.length === 1) {
        // 单项目：跟原来一样，整格实色 / 半格 0.4 alpha
        // v0.3.7：非工时类(0/1)只画一档 alpha=0.85，不显示"半"概念
        const { project, clicks } = logs[0];
        const isDays = (project.kind === 'days');
        const alpha = isDays ? 0.85 : (clicks === 1 ? 0.4 : 0.85);
        cell.style.background = hexToRgba(project.color, alpha);
        cell.classList.add('logged');
        cell.dataset.clicks = String(clicks);
      } else if (logs.length >= 2) {
        // v0.3.5：多项目 → 横向分段色条，每项目一个竖条
        // v0.3.7：非工时类项目 alpha 固定 0.85
        cell.classList.add('logged', 'multi');
        cell.dataset.clicks = logs.map(l => l.clicks).join(',');
        const n = logs.length;
        const w = 100 / n;
        logs.forEach((log, i) => {
          const bar = document.createElement('div');
          bar.className = 'cal-cell-bar';
          bar.style.left = `${(i * w).toFixed(4)}%`;
          bar.style.width = `${w.toFixed(4)}%`;
          const isDays = (log.project.kind === 'days');
          const alpha = isDays ? 0.85 : (log.clicks === 1 ? 0.4 : 0.85);
          bar.style.background = hexToRgba(log.project.color, alpha);
          cell.appendChild(bar);
        });
        // hover 提示：所有项目明细
        // v0.3.7：非工时类显示"√天"，工时类显示"半天/整天"
        const tooltip = logs.map(l => {
          if (l.project.kind === 'days') return `${l.project.name}·√天`;
          return `${l.project.name}·${l.clicks === 1 ? '半天' : '整天'}`;
        }).join(' · ');
        cell.setAttribute('title', tooltip);
      }

      const num = document.createElement('span');
      num.className = 'cal-cell-num';
      num.textContent = d;
      cell.appendChild(num);

      // 徽章：单项目 + 大格子 + 有 log 才显示
      // v0.3.7：非工时类(0/1)不显示"半"徽章(无半天概念)
      if (useBadge && logs.length === 1) {
        const isDays = (logs[0].project.kind === 'days');
        if (!isDays) {
          const badge = document.createElement('span');
          badge.className = 'cal-cell-badge';
          badge.textContent = logs[0].clicks === 1 ? '半' : '整';
          badge.style.fontSize = `${badgeFont}px`;
          cell.appendChild(badge);
        }
      }

      // 单击仍然只 toggle active project 的 log(简单点)
      // 注意：active project 不一定是 visible project(用户可能切了 active 但没显隐)
      // 所以这里也兼容 active project 是 hidden 的情况
      // v0.3.6：editMode 关闭时(只读)不绑 click handler,避免误触
      // v0.3.7：按 active project 的 kind 决定 cycle —— 工时类 0→半→整→0 (mod 3),非工时类 0→√→0 (mod 2)
      // v0.3.8：工时类项目校验"日合计 <= 1.0 天" —— 你不可能一天给 3 个项目干 0.5 天
      //   半天 = 0.5, 整天 = 1.0; 若 next 应用后跨项目合计 > 1.0 则阻止并 toast
      const activeProj = getProject(state.currentProjectId);
      if (state.editMode && activeProj && ds <= todayKey) {
        cell.addEventListener('click', () => {
          const cur = getClicks(activeProj.id, ds);
          const modulo = (activeProj.kind === 'days') ? 2 : 3;
          const next = (cur + 1) % modulo;
          // v0.3.8：工时类校验
          if (activeProj.kind === 'hours' && (next === 1 || next === 2)) {
            const newValue = (next === 1) ? 0.5 : 1.0;
            const otherTotal = getDayHoursTotal(ds, activeProj.id);
            if (otherTotal + newValue > 1.0) {
              const used = otherTotal + (cur === 1 ? 0.5 : (cur === 2 ? 1.0 : 0));
              showToast(
                `当天工时类项目已占 ${formatHoursDecimal(used)} 天 (含当前项目),无法再添${next === 1 ? '半天' : '整天'}`,
                'warn'
              );
              return;
            }
          }
          setClicks(activeProj.id, ds, next);
          renderCalendar();
          renderStats();
        });
      }
      return cell;
    }

    // 月视图：cols 锁定 7（一周一行）
    function renderSingleMonth() {
      renderCalendarView([{ y: state.viewYear, m: state.viewMonth }], 7);
    }

    // 季视图：1 块，3 个月连续流，列数由 calculateStripLayout 决定（基于 state.maxStripCols）
    function renderQuarter() {
      const months = [];
      for (let i = 0; i < 3; i++) {
        const { y, m } = addMonths(state.viewYear, state.viewMonth, i);
        months.push({ y, m });
      }
      const { cols } = calculateStripLayout(measureMainWidth());
      renderCalendarView(months, cols);
    }

    // 年视图：1 块，12 个月连续流，列数由 calculateStripLayout 决定（同季视图，跟随用户设置的星期数）
    function renderYear() {
      const months = [];
      for (let m = 0; m < 12; m++) months.push({ y: state.viewYear, m });
      const { cols } = calculateStripLayout(measureMainWidth());
      renderCalendarView(months, cols);
    }

    function renderCalendar() {
      // 先按全屏/屏占比缩窄 main.panel，再算 cellSize（measureMainWidth 读 .clientWidth）
      applyScreenRatio();
      if (state.viewMode === 'month') renderSingleMonth();
      else if (state.viewMode === 'quarter') renderQuarter();
      else if (state.viewMode === 'year') renderYear();
    }

    // ========== UI 整体宽度（仅作用于 .ui-wrap 容器）==========
    // v0.3.4+：全屏开关 + 日历宽度滑条
    //   - 全屏 ON：UI 撑满 viewport - APP_MARGIN（满宽体验）
    //   - 全屏 OFF：UI 由 state.calPanelWidth 决定（用户拖滑条或默认 cellUiW）
    //     默认 mainW = maxCellSize × mainCols + gap × (mainCols - 1)
    //     mainCols：月视图 7，季/年 = state.maxStripCols
    //
    // 影响因素清单：
    //   1. 全屏开关 state.fullscreen (true / false)
    //      - true  →  UI = appW - APP_MARGIN × 2（满宽）
    //      - false →  UI = SIDEBAR_W + mainW + STATS_W + PANEL_GAP×2 + UI_PAD×2
    //   2. 日历面板宽度 state.calPanelWidth（滑条）
    //      - null/0：使用 autoMainW（按 maxCellSize × mainCols 推算）
    //      - 用户拖过：使用滑条值
    //      - 滑条范围：7 × maxCellSize × 1.1 ~ appW × 0.7
    //   3. 方块大小上限 state.maxCellSize (40-200 px，默认 80)
    //      - 所有视图通用 cap（calcCellSize 里截断）
    //      - 滑条 min 跟它走：maxCellSize 改了 min 也要更新
    //   4. 星期数 state.maxStripCols / 7 (1-7，默认 5)
    //      - 季/年视图用：maxStripCols = weekCount × 7
    //      - 切换视图时 autoMainW 会变（mainCols 不同），滑条 value 也要更新
    //   5. Sidebar / Stats 固定宽度 SIDEBAR_W / STATS_W (240 / 280)
    //   6. .ui-wrap 内边距 PANEL_GAP / UI_PAD（panel 之间 8 + container padding 8）
    //   7. APP_MARGIN = 16（UI 跟 .app 边缘的留白，强制留 16px 防止贴屏幕）
    //
    // 公式：
    //   fullscreen ON  →  uiW = appW - APP_MARGIN*2
    //   fullscreen OFF →  mainW = state.calPanelWidth || autoMainW
    //                    uiW = SIDEBAR_W + mainW + STATS_W + PANEL_GAP*2 + UI_PAD*2
    //
    // 输出（应用 applyScreenRatio）：
    //   appW - APP_MARGIN*2 < MIN_UI_W → max-width = ''，太窄让响应式接管（堆叠）
    //   否则                            → max-width = min(uiW, appW - APP_MARGIN*2)
    //                                     关键：永远留 APP_MARGIN 边距；uiW 超过可用宽度时按可用宽度走
    //
    // 跟其他布局的关系：
    //   - 只设置 .ui-wrap.style.maxWidth，不动 sidebar/main/stats 内部布局
    //   - .app 是 flex 容器 + justify-content: center，max-width < .app 宽时自动居中
    //   - main panel 内部 cellSize 算法独立（calcCellSize / calculateStripLayout 各自算）
    const SIDEBAR_W   = 240;
    const STATS_W     = 280;
    const PANEL_GAP   = 8;       // .ui-wrap 内部 panel 间距
    const UI_PAD      = 8;       // .ui-wrap padding 单边
    const APP_MARGIN  = 16;      // UI 跟 .app 边缘的留白（强制）
    const MIN_UI_W    = 600;     // 3 panel 紧贴的最低宽度；appW - 32 比这小就走响应式
    function calcUiWidth(appW) {
      const isPortrait = window.matchMedia
        ? window.matchMedia('(orientation: portrait)').matches
        : window.innerHeight > window.innerWidth;
      // 竖屏强制全屏（窄屏本来就不能缩，关掉会让 UI 比屏还宽更难看）
      const fullscreen = isPortrait ? true : !!state.fullscreen;
      const maxCellSize = state.maxCellSize || 80;
      const maxStripCols = state.maxStripCols || DEFAULT_MAX_STRIP_COLS;

      // 全屏 UI：appW - 32（满宽，留 16px 边距）
      const fullUiW = appW - APP_MARGIN * 2;

      // 非全屏 UI：mainW = state.calPanelWidth || autoMainW
      //   - 月视图 mainCols = 7
      //   - 季/年 mainCols = maxStripCols
      //   - autoMainW = maxCellSize × mainCols + gap × (mainCols - 1)
      //   - 滑条 min 跟 autoMainW 也有关：7*maxCellSize*1.1 ≈ 1 周大小 + 10% 余量
      const isMonth = state.viewMode === 'month';
      const autoMainCols = isMonth ? 7 : maxStripCols;
      const autoMainW = maxCellSize * autoMainCols + PANEL_GAP * (autoMainCols - 1);
      const mainW = state.calPanelWidth || autoMainW;
      const userUiW = SIDEBAR_W
        + mainW
        + STATS_W
        + PANEL_GAP * 2
        + UI_PAD * 2;

      return {
        uiW: fullscreen ? fullUiW : userUiW,
        fullUiW, userUiW,
        autoMainW, mainW,
        fullscreen, maxCellSize, maxStripCols, appW
      };
    }
    function applyScreenRatio() {
      const uiWrap = document.querySelector('.ui-wrap');
      const app = uiWrap && uiWrap.parentElement;
      if (!uiWrap || !app) return;
      const appW = app.clientWidth;
      const { uiW } = calcUiWidth(appW);

      // 太窄：3 panel 放不下，UI 撑满走响应式
      if (appW - APP_MARGIN * 2 < MIN_UI_W) {
        uiWrap.style.maxWidth = '';
        return;
      }
      // 关键：永远留 APP_MARGIN 边距；算出来比可用宽度大就按可用宽度走
      // （cellSize 在 calcCellSize 会自动按 main.panel.clientWidth 缩到 20px 下限）
      const finalW = Math.min(uiW, appW - APP_MARGIN * 2);
      uiWrap.style.maxWidth = `${finalW}px`;
    }

    // v0.3.4+：日历宽度滑条 sync 助手（顶层函数，setViewMode / onResize / init 都会调）
    // - min = 7 * maxCellSize * 1.1（一周大小 + 10% 余量）
    // - max = window.innerWidth * 0.7
    // - value = state.calPanelWidth || autoMainW（用户没拖过滑条就用自动算的）
    // - 全屏 ON 时 disabled
    function getSliderRange() {
      const maxCellSize = state.maxCellSize || 80;
      const min = Math.round(7 * maxCellSize * 1.1);
      const max = Math.round(window.innerWidth * 0.7);
      // 极窄屏兜底：保证 min < max
      return { min, max: Math.max(max, min + 10) };
    }
    function getSliderValue() {
      if (state.calPanelWidth) return state.calPanelWidth;
      // autoMainW：按当前视图/星期数/方块上限算
      const isMonth = state.viewMode === 'month';
      const maxStripCols = state.maxStripCols || DEFAULT_MAX_STRIP_COLS;
      const autoMainCols = isMonth ? 7 : maxStripCols;
      const maxCellSize = state.maxCellSize || 80;
      return maxCellSize * autoMainCols + PANEL_GAP * (autoMainCols - 1);
    }
    function syncCalWidthSlider() {
      const el = document.getElementById('cal-width-input');
      if (!el) return;
      const { min, max } = getSliderRange();
      const value = getSliderValue();
      el.min = min;
      el.max = max;
      el.value = Math.min(Math.max(value, min), max);
      el.disabled = !!state.fullscreen;
    }

    // ========== Render: Stats ==========
    // v0.3.5：统计按所有 visible project 合并(active project 的概念保留用于编辑/新建)
    // v0.3.7：按 kind 区分统计
    //   - hours: 0/半天/整天 三态
    //   - days: 0/√天 二态
    function sumLogs(logs, kind) {
      kind = kind || 'hours';
      let days = 0, half = 0;
      if (kind === 'days') {
        // 非工时类：clicks >= 1 算 1 天（实际数据只会是 0 或 1）
        Object.values(logs).forEach(c => { if (c >= 1) days++; });
      } else {
        Object.values(logs).forEach(c => {
          if (c === 1) half++;
          else if (c === 2) days++;
        });
      }
      const total = kind === 'days' ? days : (days + half * 0.5);
      const hours = kind === 'days' ? 0 : (days * 8 + half * 4);
      return { days, half, total, hours };
    }
    // 按视图范围筛 logs（合并所有 visible 项目的）,按 kind 分类返回
    function getLogsInRange() {
      const visibleProjects = getVisibleProjects();
      const combined = { hours: {}, days: {} };
      const months = state.viewMode === 'month'
        ? [{ y: state.viewYear, m: state.viewMonth }]
        : Array.from({ length: VIEW_COUNT[state.viewMode] }, (_, i) =>
            addMonths(state.viewYear, state.viewMonth, i));
      const prefixes = months.map(({ y, m }) => `${y}-${pad2(m + 1)}`);
      visibleProjects.forEach(p => {
        const kind = p.kind || 'hours';
        const logs = state.logs[p.id] || {};
        Object.entries(logs).forEach(([k, v]) => {
          if (prefixes.some(pre => k.startsWith(pre))) combined[kind][k] = v;
        });
      });
      return combined;
    }
    function getAllLogs() {
      // 所有 visible 项目的全部 logs(总计用,不受视图范围限制),按 kind 分类
      const combined = { hours: {}, days: {} };
      getVisibleProjects().forEach(p => {
        const kind = p.kind || 'hours';
        Object.assign(combined[kind], state.logs[p.id] || {});
      });
      return combined;
    }
    // v0.3.7：格式化 hours 子统计（"X 整天 · Y 半天"）
    function formatHoursSub(sum) {
      const parts = [];
      if (sum.days > 0) parts.push(`${sum.days} 整天`);
      if (sum.half > 0) parts.push(`${sum.half} 半天`);
      return parts.length > 0 ? parts.join(' · ') : '0';
    }
    // v0.3.8：把工时类"天"小数值格式化为"X 天"或"X.X 天" (用于 toast 提示)
    function formatHoursDecimal(v) {
      return Number.isInteger(v) ? `${v}` : v.toFixed(1);
    }
    // v0.3.8：通用 toast —— 工时校验等一次性反馈
    // 同一个 toast 短时间连发时,取消上一轮的 timer,新消息会重新计时
    let _toastTimer = null;
    // v0.3.9：项目 modal 当前模式 —— null = 新建,字符串 = 正在编辑该 id 的项目
    // 不存 state(临时 UI 状态,刷新后回到默认)
    let _editingProjectId = null;
    // v0.3.9.1：项目编辑模式 (sidebar 底部按钮切换的) —— 临时 UI 状态
    //   - 刷新页面 / 切换 active 项目都自动退出 (li click handler 里设回 false)
    //   - 不入 state,不入 localStorage (防止刷新后忘记自己开了 edit 模式误删)
    let _projectEditMode = false;
    function showToast(msg, type) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('warn');
      if (type === 'warn') el.classList.add('warn');
      // 强制重排,保证连续触发时 transition 重新跑
      el.classList.remove('show');
      // eslint-disable-next-line no-unused-expressions
      el.offsetHeight;
      el.classList.add('show');
      if (_toastTimer) clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => {
        el.classList.remove('show');
      }, 2500);
    }
    function renderStats() {
      const visibleProjects = getVisibleProjects();
      const titleEl = document.getElementById('stats-title');
      const body = document.getElementById('stats-body');

      if (visibleProjects.length === 0) {
        // 没有可见项目
        if (state.projects.length === 0) {
          titleEl.textContent = '统计';
          body.innerHTML = '<p class="empty">先在左侧建一个项目 👈</p>';
        } else {
          titleEl.textContent = '统计';
          body.innerHTML = '<p class="empty">所有项目都已隐藏,显示一个看看 👁</p>';
        }
        return;
      }

      // 标题：1 个项目用项目名,多个用"N 个项目"
      if (visibleProjects.length === 1) {
        const p = visibleProjects[0];
        titleEl.innerHTML = `<span class="dot" style="background:${p.color}"></span>${escapeHtml(p.name)}`;
      } else {
        titleEl.textContent = `统计 · ${visibleProjects.length} 个项目`;
      }

      // v0.3.7：按 kind 分别求和
      const allLogs = getAllLogs();
      const rangeLogs = getLogsInRange();
      const allHours = sumLogs(allLogs.hours, 'hours');
      const allDays = sumLogs(allLogs.days, 'days');
      const rangeHours = sumLogs(rangeLogs.hours, 'hours');
      const rangeDays = sumLogs(rangeLogs.days, 'days');
      const allTotal = allHours.total + allDays.total;
      const rangeTotal = rangeHours.total + rangeDays.total;

      // 多项目时,本月 card 下加每个项目的小计（按 kind 显示不同格式）
      const breakdown = visibleProjects.length >= 2
        ? visibleProjects.map(p => {
            const kind = p.kind || 'hours';
            const sub = sumLogs(state.logs[p.id] || {}, kind);
            const val = (kind === 'days')
              ? `${sub.total} 天`
              : `${sub.days} 整天 · ${sub.half} 半天`;
            return `<div class="stat-breakdown-row">
              <span class="dot" style="background:${p.color}"></span>
              <span class="name">${escapeHtml(p.name)}</span>
              <span class="val">${val}</span>
            </div>`;
          }).join('')
        : '';

      // 格式化 sub 文字："工时 X 整天 · Y 半天 + 非工时 N 天"
      function formatSub(hoursSum, daysSum) {
        const parts = [];
        if (hoursSum.total > 0) parts.push(`工时 ${formatHoursSub(hoursSum)}`);
        if (daysSum.total > 0) parts.push(`非工时 ${daysSum.total} 天`);
        return parts.length > 0 ? parts.join(' + ') : '—';
      }

      const monthLabel = state.viewMode === 'month' ? '本月' :
                         state.viewMode === 'quarter' ? '本季度' : '本年';
      body.innerHTML = `
        <div class="stat-card">
          <div class="stat-label">${monthLabel}</div>
          <div class="stat-value">${rangeTotal}<span class="unit">天</span></div>
          <div class="stat-sub">${formatSub(rangeHours, rangeDays)}</div>
          ${breakdown ? `<div class="stat-breakdown">${breakdown}</div>` : ''}
        </div>
        <div class="stat-card">
          <div class="stat-label">总计</div>
          <div class="stat-value">${allTotal}<span class="unit">天</span></div>
          <div class="stat-sub">${formatSub(allHours, allDays)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">折合小时</div>
          <div class="stat-value">${allHours.hours.toFixed(1)}<span class="unit">h</span></div>
          <div class="stat-sub">1 整天 = 8h, 1 半天 = 4h（仅工时类）</div>
        </div>
      `;
    }

    function renderAll() {
      renderProjects();
      renderHeader();
      renderCalendar();
      renderStats();
    }

    // ========== Color Picker ==========
    // selectedColor (v0.3.9)：可传入一个预选色,用于"编辑项目"时回填当前颜色
    function renderColorPicker(selectedColor) {
      const picker = document.getElementById('color-picker');
      picker.innerHTML = '';
      const sel = selectedColor || COLORS[0];
      COLORS.forEach((c) => {
        const sw = document.createElement('button');
        sw.className = 'swatch' + (c === sel ? ' selected' : '');
        sw.style.background = c;
        sw.dataset.color = c;
        sw.type = 'button';
        sw.addEventListener('click', () => {
          picker.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
          sw.classList.add('selected');
        });
        picker.appendChild(sw);
      });
    }
    function getSelectedColor() {
      const sel = document.querySelector('#color-picker .swatch.selected');
      return sel ? sel.dataset.color : COLORS[0];
    }

    // ========== Wire up ==========
    // v0.3.4+：更新导航按钮 title（按当前视图显示实际步长）
    // - 月视图：上一月/下一月
    // - 季视图：上一季(3个月)/下一季
    // - 年视图：上一年/下一年
    function updateNavTitles() {
      const step = VIEW_STEP[state.viewMode];
      let label;
      if (state.viewMode === 'month') label = '月';
      else if (state.viewMode === 'quarter') label = '季（3 个月）';
      else label = '年';
      document.getElementById('prev-month').title = `上一${label}`;
      document.getElementById('next-month').title = `下一${label}`;
    }
    function shiftView(delta) {
      const step = VIEW_STEP[state.viewMode];
      const r = addMonths(state.viewYear, state.viewMonth, delta * step);
      state.viewYear = r.y;
      state.viewMonth = r.m;
      saveState();
      renderHeader();
      renderCalendar();
      renderStats();
    }
    function goToday() {
      const t = new Date();
      state.viewYear = t.getFullYear();
      // 锚定到当前视图的起点：年 → 1 月、季 → 季首月、月 → 今天
      if (state.viewMode === 'year') {
        state.viewMonth = 0;
      } else if (state.viewMode === 'quarter') {
        state.viewMonth = Math.floor(t.getMonth() / 3) * 3;
      } else {
        state.viewMonth = t.getMonth();
      }
      saveState();
      renderHeader();
      renderCalendar();
      renderStats();
    }
    function setViewMode(mode) {
      if (!VIEW_STEP[mode] || state.viewMode === mode) return;
      // 切换时把 viewMonth 对齐到当前视图的起点：本季 / 本年
      if (mode === 'quarter') {
        state.viewMonth = Math.floor(state.viewMonth / 3) * 3;
      } else if (mode === 'year') {
        state.viewMonth = 0;
      }
      state.viewMode = mode;
      saveState();
      // 视图变了 → mainCols 变了（季/年走 maxStripCols，月走 7）→ 滑条 autoMainW 变了
      syncCalWidthSlider();
      // 视图变了 → 导航按钮的步长也变了（1月 / 3月 / 12月）→ 更新 title
      updateNavTitles();
      renderAll();
    }
    // v0.3.9：openModal 拆成两个 —— openModal (新建) + openModalForEdit (编辑,预填)
    // 通过模块级 _editingProjectId 区分两种模式,confirmProject 里分支处理
    function openModal() {
      _editingProjectId = null;
      document.getElementById('project-modal-title').textContent = '新建项目';
      document.getElementById('project-name').value = '';
      renderColorPicker();
      // v0.3.7：重置 kind 选择到默认工时
      const hoursRadio = document.querySelector('input[name="project-kind"][value="hours"]');
      if (hoursRadio) hoursRadio.checked = true;
      document.getElementById('project-modal').classList.remove('hidden');
      setTimeout(() => {
        const input = document.getElementById('project-name');
        if (input) input.focus();
      }, 0);
    }
    // v0.3.9：编辑模式 —— 复用同一个 modal,预填 name/color/kind,标题改"编辑项目"
    function openModalForEdit(projectId) {
      const proj = getProject(projectId);
      if (!proj) return;
      _editingProjectId = projectId;
      document.getElementById('project-modal-title').textContent = '编辑项目';
      document.getElementById('project-name').value = proj.name;
      renderColorPicker(proj.color);
      const kind = proj.kind || 'hours';
      const kindRadio = document.querySelector(`input[name="project-kind"][value="${kind}"]`);
      if (kindRadio) kindRadio.checked = true;
      document.getElementById('project-modal').classList.remove('hidden');
      setTimeout(() => {
        const input = document.getElementById('project-name');
        if (input) { input.focus(); input.select(); }
      }, 0);
    }
    function closeModal() {
      // v0.3.9：close 时清掉 _editingProjectId,避免下次 open 时误判
      _editingProjectId = null;
      document.getElementById('project-modal').classList.add('hidden');
    }

    // v0.3.4+：设置菜单 open/close helper
    // - 弹窗是 fixed 定位（相对视口），不会跟 main panel 宽度变化跑位
    // - 打开时根据设置按钮的 getBoundingClientRect() 算 top/right，弹窗右边缘对齐按钮右边缘
    // - 关闭时清掉 inline top/right，下次打开重新算（防止 resize 后位置过期）
    function openSettingsMenu() {
      const btn = document.getElementById('settings-btn');
      const menu = document.getElementById('settings-menu');
      const rect = btn.getBoundingClientRect();
      // 弹窗在按钮正下方 6px,右边缘跟按钮右边缘对齐
      menu.style.top = `${rect.bottom + 6}px`;
      menu.style.right = `${window.innerWidth - rect.right}px`;
      menu.classList.remove('hidden');
    }
    function closeSettingsMenu() {
      const menu = document.getElementById('settings-menu');
      menu.classList.add('hidden');
      // 清掉 inline style,下次打开时按当前按钮位置重新算
      menu.style.top = '';
      menu.style.right = '';
    }
    function toggleSettingsMenu() {
      const menu = document.getElementById('settings-menu');
      if (menu.classList.contains('hidden')) openSettingsMenu();
      else closeSettingsMenu();
    }
    // v0.3.9：confirmProject 分支 —— _editingProjectId 设了 = 编辑模式(修改现有项目),否则 = 新建
    function confirmProject() {
      const name = document.getElementById('project-name').value.trim();
      if (!name) { alert('请输入项目名'); return; }
      const kindEl = document.querySelector('input[name="project-kind"]:checked');
      const kind = kindEl ? kindEl.value : 'hours';
      const color = getSelectedColor();
      if (_editingProjectId) {
        // 编辑模式：修改现有项目
        const proj = getProject(_editingProjectId);
        if (!proj) { closeModal(); return; }
        // 名称唯一性检查 —— 排除自身
        if (state.projects.some(p => p.id !== proj.id && p.name === name)) {
          alert('已有同名项目，换一个？');
          return;
        }
        proj.name = name;
        proj.color = color;
        proj.kind = kind;
        saveState();
        closeModal();
        renderAll();
      } else {
        // 新建模式 (v0.3.7 之前的逻辑)
        if (state.projects.some(p => p.name === name)) {
          alert('已有同名项目，换一个？');
          return;
        }
        const id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        state.projects.push({ id, name, color, visible: true, kind });
        state.currentProjectId = id;
        saveState();
        closeModal();
        renderAll();
      }
    }

    // ========== Init ==========
    function init() {
      loadState();
      renderColorPicker();
      renderAll();

      // 视口缩放时重算布局（季/年视图列数和格子大小、月视图字号、屏占比 main.panel 宽度）
      // v0.3.2：orientationchange 同步触发（竖横屏切换时屏占比 100% / 自适应立即生效）
      // v0.3.4+：滑条 max = window.innerWidth * 0.7，resize 时也要更新
      // v0.3.4+：如果设置菜单开着,重新算位置（按钮在 viewport 里的坐标变了）
      let _resizeTimer = null;
      const onResize = () => {
        clearTimeout(_resizeTimer);
        _resizeTimer = setTimeout(() => {
          syncCalWidthSlider();
          renderCalendar();
          if (!settingsMenu.classList.contains('hidden')) {
            openSettingsMenu();
          }
        }, 100);
      };
      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', onResize);

      document.getElementById('prev-month').addEventListener('click', () => shiftView(-1));
      document.getElementById('next-month').addEventListener('click', () => shiftView(1));
      document.getElementById('today-btn').addEventListener('click', goToday);
      document.getElementById('view-toggle').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-view]');
        if (btn) setViewMode(btn.dataset.view);
      });

      // 设置按钮 + 菜单
      const settingsBtn = document.getElementById('settings-btn');
      const settingsMenu = document.getElementById('settings-menu');
      const maxColsInput = document.getElementById('max-cols-input');
      const maxCellInput = document.getElementById('max-cell-input');
      const fullscreenInput = document.getElementById('fullscreen-input');
      const calWidthInput = document.getElementById('cal-width-input');
      // 星期数 input：用户输入 1-7 整数，state 存对应的 7 的倍数（1=7, 5=35, 7=49）
      maxColsInput.value = state.maxStripCols / 7;
      maxCellInput.value = state.maxCellSize;
      // 全屏 checkbox
      fullscreenInput.checked = !!state.fullscreen;
      // v0.3.4+：滑条 sync 助手 —— 任何 state 变了都调一下同步 min/max/value/disabled
      // （syncCalWidthSlider 已经在 applyScreenRatio 之后定义成顶层函数）
      syncCalWidthSlider();
      // v0.3.4+：导航按钮 title 同步当前视图（上一月/上一季/上一年）
      updateNavTitles();
      // v0.3.6：编辑模式开关 —— 切换 state.editMode，重渲染 cell（决定是否绑 click handler）
      const editBtn = document.getElementById('edit-toggle');
      editBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        state.editMode = !state.editMode;
        saveState();
        renderHeader();   // 更新按钮 active + cal-view readonly-mode class
        renderCalendar(); // 重新构建 cell,根据 editMode 决定是否绑 click
      });
      settingsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleSettingsMenu();
      });
      document.addEventListener('click', (e) => {
        if (!settingsMenu.contains(e.target) && e.target !== settingsBtn) {
          closeSettingsMenu();
        }
      });
      maxColsInput.addEventListener('change', () => {
        // 用户输入 1-7 整数（星期数），自动 *7 转换
        let v = parseInt(maxColsInput.value, 10);
        if (isNaN(v) || v < 1) v = 1;
        if (v > 7) v = 7;
        maxColsInput.value = v;
        state.maxStripCols = v * 7;
        saveState();
        // 星期数变了 → autoMainW 变了（季/年视图）→ 滑条 value 要更新
        syncCalWidthSlider();
        renderCalendar();
      });
      maxCellInput.addEventListener('change', () => {
        // v0.3.4：方块大小上限（40-200 px），所有视图通用 cap
        let v = parseInt(maxCellInput.value, 10);
        if (isNaN(v) || v < 40) v = 40;
        if (v > 200) v = 200;
        maxCellInput.value = v;
        state.maxCellSize = v;
        saveState();
        // 方块上限变了 → 滑条 min（7*maxCellSize*1.1）要更新
        syncCalWidthSlider();
        renderCalendar();
      });
      fullscreenInput.addEventListener('change', () => {
        // v0.3.4：全屏开关
        state.fullscreen = fullscreenInput.checked;
        saveState();
        // 全屏切换 → 滑条 enabled/disabled 切换
        syncCalWidthSlider();
        renderCalendar();
      });
      calWidthInput.addEventListener('input', () => {
        // v0.3.4+：拖动滑条 → 更新 state.calPanelWidth，重新算 UI 宽度 + cellSize
        const v = parseInt(calWidthInput.value, 10);
        if (!isNaN(v) && v > 0) {
          state.calPanelWidth = v;
          saveState();
          renderCalendar();
        }
      });

      document.getElementById('add-project').addEventListener('click', openModal);
      // v0.3.9.1：项目编辑模式切换按钮 —— toggle 模块级 _projectEditMode + re-render sidebar
      //   不调 saveState —— 临时 UI 状态不入 localStorage,刷新自动退出
      document.getElementById('toggle-edit-projects').addEventListener('click', () => {
        _projectEditMode = !_projectEditMode;
        renderProjects();
      });
      document.getElementById('cancel-project').addEventListener('click', closeModal);
      document.getElementById('confirm-project').addEventListener('click', confirmProject);
      document.getElementById('project-name').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') confirmProject();
        if (e.key === 'Escape') closeModal();
      });
      document.getElementById('project-modal').addEventListener('click', (e) => {
        if (e.target.id === 'project-modal') closeModal();
      });
    }

    init();
  </script>
</body>
</html>
