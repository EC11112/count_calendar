<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计数日历</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --border: #e5e7eb;
      --text: #1f2937;
      --text-soft: #6b7280;
      --text-faint: #9ca3af;
      --accent: #3b82f6;
      --hover: #f3f4f6;
      --today-ring: #111827;
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    .app {
      display: grid;
      grid-template-columns: 240px 1fr 280px;
      gap: 16px;
      padding: 16px;
      height: 100vh;
      /* 不再 max-width: 1400px —— 4k 屏下被锁死，2k+ 大屏体验不到自适应 */
      margin: 0 auto;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 16px;
      overflow: auto;
    }

    /* ===== Sidebar ===== */
    .sidebar { display: flex; flex-direction: column; }
    .sidebar h2 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-soft);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .project-list { list-style: none; margin: 0 0 12px; padding: 0; flex: 1; }
    .project-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }
    .project-item:hover { background: var(--hover); }
    .project-item.active { background: var(--hover); }
    .project-item .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255,255,255,1), 0 0 0 3px rgba(0,0,0,0.06);
    }
    .project-item .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .project-item .del {
      visibility: hidden;
      background: transparent;
      border: 0;
      color: var(--text-faint);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .project-item:hover .del { visibility: visible; }
    .project-item .del:hover { background: #fee2e2; color: #dc2626; }

    .btn {
      width: 100%;
      padding: 8px 12px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--text-soft);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); background: #eff6ff; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent);
    }
    .btn-primary:hover { background: #2563eb; border-color: #2563eb; color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-soft); }
    .btn-ghost:hover { background: var(--hover); color: var(--text); }

    /* ===== Calendar: header & view toggle ===== */
    .cal-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .nav-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .cal-header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cal-header button {
      padding: 4px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-soft);
      font-size: 14px;
      font-family: inherit;
    }
    .cal-header button:hover { background: var(--hover); color: var(--text); }

    .view-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .view-toggle button {
      padding: 4px 14px;
      background: var(--panel);
      border: 0;
      border-right: 1px solid var(--border);
      color: var(--text-soft);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      min-width: 48px;
    }
    .view-toggle button:last-child { border-right: 0; }
    .view-toggle button:hover { background: var(--hover); color: var(--text); }
    .view-toggle button.active {
      background: var(--accent);
      color: #fff;
    }

    /* ===== Header: settings (right side) ===== */
    .header-actions { position: relative; flex-shrink: 0; }
    .header-icon-btn {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-soft);
      font-size: 16px;
      padding: 0;
      font-family: inherit;
    }
    .header-icon-btn:hover { background: var(--hover); color: var(--text); }
    .settings-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      z-index: 20;
      min-width: 220px;
    }
    .settings-menu.hidden { display: none; }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      color: var(--text);
    }
    .settings-row input[type="number"] {
      width: 100px;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      text-align: center;
      outline: none;
    }
    .settings-row input[type="number"]:focus { border-color: var(--accent); }
    .settings-row select {
      width: 100px;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      cursor: pointer;
      outline: none;
    }
    .settings-row select:focus { border-color: var(--accent); }
    /* 行内的悬浮小注释（紧跟 label/title） */
    .settings-inline-hint {
      display: inline-block;
      margin-left: 4px;
      width: 14px;
      height: 14px;
      line-height: 14px;
      text-align: center;
      border-radius: 50%;
      background: var(--hover);
      color: var(--text-soft);
      font-size: 10px;
      cursor: help;
      user-select: none;
    }
    .settings-inline-hint:hover { background: var(--accent); color: #fff; }
    .settings-hint {
      margin: 8px 0 0;
      font-size: 11px;
      color: var(--text-faint);
      line-height: 1.4;
    }

    /* ===== Calendar: single month ===== */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 6px;
    }
    .weekdays span {
      text-align: center;
      /* 月视图字号固定，不参与 strip 动态字号算法（v0.3.0 拆开） */
      font-size: 14px;
      color: var(--text-faint);
      padding: 6px 0;
      font-weight: 500;
    }
    .weekdays span:nth-child(1),
    .weekdays span:nth-child(7) { color: #ef4444; }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .day {
      aspect-ratio: 1 / 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 6px 8px;
      /* 月视图字号固定 14px，不参与 strip 动态字号算法（v0.3.0 拆开） */
      font-size: 14px;
      color: var(--text-soft);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      position: relative;
      overflow: hidden;
    }
    .day.blank { background: transparent; border: 0; cursor: default; }
    .day:hover:not(.blank):not(.future) {
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .day.future { cursor: not-allowed; opacity: 0.5; }
    .day.logged { color: #fff; font-weight: 600; text-shadow: 0 1px 1px rgba(0,0,0,0.15); }
    .day.logged[data-clicks="1"] { color: var(--text); text-shadow: none; }
    .day.today { box-shadow: 0 0 0 2px var(--today-ring) inset; }
    .day-num { position: relative; z-index: 1; }
    .day .badge {
      position: absolute;
      bottom: 4px;
      left: 4px;
      /* 月视图 badge 字号固定 10px，不参与 strip 动态字号算法 */
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(255,255,255,0.35);
      color: inherit;
    }

    /* ===== Calendar: continuous strip (quarter / year) ===== */
    .strip-wrap {
      display: flex;
      flex-direction: column;
      gap: 18px;
      /* 屏占比由 main.panel 整体缩窄控制（v0.3.1 起），strip 内部直接 stretch 到 panel */
    }
    .weekday-row {
      display: grid;
      /* grid-template-columns 和 font-size 由 JS 根据视口动态算 */
      gap: 2px;
      color: var(--text-soft);
      text-align: center;
      margin-bottom: 3px;
      /* stretch 到 main.panel 宽度（v0.3.1 起），跟 day-strip 严格列对齐 */
      width: 100%;
    }
    .weekday-row span { padding: 1px 0; }
    .weekday-row span.wkn { color: #ef4444; }

    .day-strip {
      display: grid;
      /* grid-template-columns 和 font-size 由 JS 根据视口动态算 */
      gap: 2px;
      width: 100%;
    }
    .strip-day {
      /* 正方形：宽 = 网格列宽 = 网格列宽，aspect-ratio 强制高 = 宽 */
      aspect-ratio: 1 / 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      /* font-size 由 JS 动态算（cell * 0.2，夹 9-24） */
      color: var(--text-soft);
      cursor: pointer;
      position: relative;
    }
    .strip-day.blank { background: transparent; border: 0; cursor: default; }
    .strip-day.future { cursor: not-allowed; opacity: 0.4; }
    .strip-day.logged { color: #fff; font-weight: 600; }
    .strip-day.logged[data-clicks="1"] { color: var(--text); font-weight: 400; }
    .strip-day.today { box-shadow: 0 0 0 1.5px var(--today-ring) inset; }
    /* 周末的日期数字：与 weekday 一致（红/灰区分） */
    .strip-day.wkn:not(.logged) .strip-day-num { color: #ef4444; }
    .strip-day-num { line-height: 1; }

    /* 大格子（cellSize >= 35）：切月视图样式 — 日期右上角、徽章左下角，不再居中 */
    .strip-day.with-badge {
      display: block;
      padding: 3px 5px;
    }
    .strip-day.with-badge .strip-day-num {
      position: absolute;
      top: 2px;
      right: 4px;
      font-size: 0.6em; /* 相对 cell 的 70%，徽章更小 */
      font-weight: 500;
    }
    .strip-day-badge {
      position: absolute;
      bottom: 2px;
      left: 4px;
      font-size: 0.45em;
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(255,255,255,0.35);
      color: inherit;
      line-height: 1.1;
    }
    .strip-day.logged[data-clicks="2"] .strip-day-badge { background: rgba(255,255,255,0.45); }

    /* 年视图：gap 更小，1px 让 53 行不至于太松散 */
    .day-strip.year-strip { gap: 1px; }

    /* ===== Stats ===== */
    .stats h2 {
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stats h2 .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255,255,255,1), 0 0 0 3px rgba(0,0,0,0.06);
    }
    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .stat-label { font-size: 12px; color: var(--text-faint); margin-bottom: 4px; }
    .stat-value { font-size: 24px; font-weight: 600; }
    .stat-value .unit { font-size: 13px; color: var(--text-soft); margin-left: 4px; font-weight: 400; }
    .stat-sub { font-size: 12px; color: var(--text-soft); margin-top: 2px; }

    .empty { color: var(--text-faint); text-align: center; padding: 32px 8px; }

    /* ===== Modal ===== */
    .modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal.hidden { display: none; }
    .modal-content {
      background: var(--panel);
      border-radius: 12px;
      padding: 20px;
      width: 320px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }
    .modal-content h3 { margin: 0 0 16px; font-size: 16px; }
    .modal-content label {
      display: block;
      font-size: 12px;
      color: var(--text-soft);
      margin-bottom: 12px;
    }
    .modal-content input[type="text"] {
      width: 100%;
      margin-top: 4px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .modal-content input[type="text"]:focus { border-color: var(--accent); }
    .color-picker {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    .swatch {
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
    }
    .swatch.selected { border-color: var(--text); transform: scale(1.1); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-actions button { width: auto; padding: 6px 14px; }

    /* ===== Responsive ===== */
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; height: auto; }
      .panel { max-height: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel sidebar">
      <h2>项目</h2>
      <ul class="project-list" id="project-list"></ul>
      <button class="btn" id="add-project">+ 新建项目</button>
    </aside>

    <main class="panel">
      <div class="cal-header">
        <div class="nav-group">
          <button id="prev-month" title="上一步">‹</button>
          <h1 id="month-label"></h1>
          <button id="next-month" title="下一步">›</button>
          <button id="today-btn">今天</button>
        </div>
        <div class="view-toggle" id="view-toggle" role="tablist">
          <button data-view="month"   title="月视图">月</button>
          <button data-view="quarter" title="季度视图（3 个月）">季</button>
          <button data-view="year"    title="年视图（12 个月）">年</button>
        </div>
        <div class="header-actions">
          <button id="settings-btn" class="header-icon-btn" title="设置" aria-label="设置">⚙</button>
          <div class="settings-menu hidden" id="settings-menu">
            <label class="settings-row">
              <span>最大列数</span>
              <input type="number" id="max-cols-input" min="7" max="49" step="7">
            </label>
            <label class="settings-row">
              <span>
                屏占比
                <span class="settings-inline-hint" title="横屏占比：4k/2k 大屏拉到 100% 容易显得太满，降到 75%–83% 更舒服；平板/手机全屏场景可以保持 100%">?</span>
              </span>
              <select id="screen-ratio-input">
                <option value="1">100%</option>
                <option value="0.83">83%</option>
                <option value="0.75">75%</option>
                <option value="0.66">66%</option>
                <option value="0.5">50%</option>
              </select>
            </label>
            <p class="settings-hint">列数 21–28（cellSize 41–49px）效果最佳</p>
          </div>
        </div>
      </div>

      <!-- 月视图 -->
      <div id="single-view">
        <div class="weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="days" id="days"></div>
      </div>

      <!-- 季/年视图：连续 strip 布局 -->
      <div class="strip-wrap" id="strip-wrap" style="display:none"></div>
    </main>

    <section class="panel stats">
      <h2 id="stats-title">统计</h2>
      <div id="stats-body"></div>
    </section>
  </div>

  <div class="modal hidden" id="project-modal">
    <div class="modal-content">
      <h3>新建项目</h3>
      <label>项目名称
        <input type="text" id="project-name" maxlength="20" placeholder="例如：学习、跑步">
      </label>
      <div class="color-picker" id="color-picker"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancel-project">取消</button>
        <button class="btn btn-primary" id="confirm-project">确定</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    // ========== Config ==========
    const STORAGE_KEY = 'count_calendar_v2';
    const HOURS_PER_DAY = 8;
    const COLORS = [
      '#ef4444', '#f59e0b', '#eab308', '#10b981',
      '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899'
    ];
    const DEFAULT_PROJECTS = [
      { id: 'p_default_study', name: '学习', color: '#3b82f6' },
      { id: 'p_default_sport', name: '运动', color: '#10b981' },
      { id: 'p_default_work',  name: '工作', color: '#f59e0b' }
    ];
    const VIEW_STEP  = { month: 1, quarter: 3, year: 12 };
    const VIEW_COUNT = { month: 1, quarter: 3, year: 12 };
    const WEEKDAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];

    // ========== Strip layout (季/年视图自适应) ==========
    // 原则：
    //  1) 单行渲染列数必须是 7 的倍数（保证星期整除）
    //  2) 日期块必须正方形（aspect-ratio: 1/1）
    //  3) 格子像素必须 >= 41（1080*0.8/21 的舒适下限）
    //  4) 在保证 (3) 的前提下尽量多列填满屏幕
    // 算法：从 MAX 往下试 7 的倍数，第一个 cellSize >= 41 的列数即为最优
    // MAX_STRIP_COLS 默认 35（≈ 49 * 3/4，即 3/4 个完整星期数），可由用户在右上角设置菜单里调
    const DEFAULT_MAX_STRIP_COLS = 35;
    const MIN_CELL_SIZE     = 41;        // 1080 * 0.8 / 21 ≈ 41，下限
    const STRIP_GAP         = 2;
    const MIN_STRIP_COLS    = 7;
    // 字体算法（v0.3.0 调小）：
    //  - 0.7/0.5 那版数字太大、看着像加粗（浏览器在 font-size 接近格子边长时抗锯齿退化）
    //  - 改 0.5/0.4 配合 cap 28/18，cell=41 时 label≈20/21，cell=80 时 label≈28（cap）
    //  - 月视图不参与这套，CSS 写死 14/14/10
    const LABEL_FONT_RATIO  = 0.5;       // weekday / date 数字 / 月份标签
    const BADGE_FONT_RATIO  = 0.4;       // "半" / "整" 徽章
    const MIN_LABEL_FONT    = 14;        // cell=28 兜底字（不被 min cell 触发）
    const MAX_LABEL_FONT    = 28;        // 2k+ 大屏 cap，避免再像加粗
    const MIN_BADGE_FONT    = 9;
    const MAX_BADGE_FONT    = 18;
    // 徽章渲染阈值（v0.3.0 改公式）：
    //  - 旧值 35 在 1080p 半屏竖屏触发，但小格里 "半" 跟日期数字会重叠
    //  - 用户公式 cellSize > 字体px * 4：参考最小字号 14 * 4 = 56，作为"能放下 4 个字"的最小宽度
    //  - 56 也正好是 1080p 全屏能舒服触发的下限，4k 大屏远超
    const REF_FONT_FOR_BADGE = 14;       // 参考最小字号
    const BADGE_MIN_CELLSIZE = REF_FONT_FOR_BADGE * 4;  // = 56
    function shouldShowBadge(cellSize) { return cellSize >= BADGE_MIN_CELLSIZE; }

    function calculateStripLayout(containerWidth) {
      // v0.3.0：先按 state.screenRatio 收一收 effectiveWidth
      // 屏占比 = 横向用多少比例填充 panel（比如 1.0 全填、0.75 居中留白）
      const ratio = state.screenRatio || 1.0;
      const effectiveWidth = Math.floor(containerWidth * ratio);
      const maxCols = state.maxStripCols || DEFAULT_MAX_STRIP_COLS;
      const top = Math.max(MIN_STRIP_COLS, Math.min(maxCols, 49) - (maxCols - 1) % 7 - 1 + 1);
      // 把 maxCols 向下取整到 7 的倍数
      const maxAligned = Math.floor(maxCols / 7) * 7;
      for (let cols = maxAligned; cols >= MIN_STRIP_COLS; cols -= 7) {
        const cellSize = Math.floor((effectiveWidth - STRIP_GAP * (cols - 1)) / cols);
        if (cellSize >= MIN_CELL_SIZE) return { cols, cellSize };
      }
      // 极窄屏兜底：用 7 列、cell 尽可能大（允许 < 41）
      const fallback = Math.floor((effectiveWidth - STRIP_GAP * (MIN_STRIP_COLS - 1)) / MIN_STRIP_COLS);
      return { cols: MIN_STRIP_COLS, cellSize: Math.max(fallback, 20) };
    }
    function calcLabelFontSize(cellSize) {
      return Math.max(MIN_LABEL_FONT, Math.min(MAX_LABEL_FONT, Math.round(cellSize * LABEL_FONT_RATIO)));
    }
    function calcBadgeFontSize(cellSize) {
      return Math.max(MIN_BADGE_FONT, Math.min(MAX_BADGE_FONT, Math.round(cellSize * BADGE_FONT_RATIO)));
    }
    function measureStripWidth() {
      const wrap = document.getElementById('strip-wrap') || document.getElementById('single-view');
      const panel = (wrap && wrap.closest('.panel')) || document.querySelector('main.panel');
      const inner = panel ? panel.clientWidth - 32 : 0;
      return Math.max(inner, 280);
    }
    function measureMonthWidth() {
      // 月视图固定 7 列，gap = 6
      const panel = document.querySelector('main.panel');
      const inner = panel ? panel.clientWidth - 32 : 0;
      return Math.max(inner, 280);
    }

    // ========== State ==========
    let state = {
      projects: [],
      currentProjectId: null,
      logs: {},
      viewYear: null,
      viewMonth: null,
      viewMode: 'month',
      maxStripCols: DEFAULT_MAX_STRIP_COLS,
      // v0.3.0：横屏屏占比（1.0 全填，0.75 居中 75% 宽），大屏不要太夸张
      screenRatio: 1.0
    };

    // 屏占比合法档位（5 档：100/83/75/66/50）
    const SCREEN_RATIO_OPTIONS = [1.0, 0.83, 0.75, 0.66, 0.5];
    function normalizeScreenRatio(v) {
      // 找最近的合法档位
      let best = SCREEN_RATIO_OPTIONS[0];
      let bestDelta = Math.abs(v - best);
      for (const opt of SCREEN_RATIO_OPTIONS) {
        const d = Math.abs(v - opt);
        if (d < bestDelta) { best = opt; bestDelta = d; }
      }
      return best;
    }

    // ========== Storage ==========
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = Object.assign(state, parsed);
        }
      } catch (e) {
        console.warn('loadState failed:', e);
      }
      if (!Array.isArray(state.projects) || state.projects.length === 0) {
        state.projects = DEFAULT_PROJECTS.slice();
      }
      if (!state.currentProjectId && state.projects[0]) {
        state.currentProjectId = state.projects[0].id;
      }
      if (!state.logs || typeof state.logs !== 'object') state.logs = {};
      const now = new Date();
      if (state.viewYear == null || state.viewYear < 1900) state.viewYear = now.getFullYear();
      if (state.viewMonth == null || state.viewMonth < 0 || state.viewMonth > 11) state.viewMonth = now.getMonth();
      if (!VIEW_STEP[state.viewMode]) state.viewMode = 'month';
      // maxStripCols 必须是 7 的倍数且 >= 7
      if (typeof state.maxStripCols !== 'number' || state.maxStripCols < 7) {
        state.maxStripCols = DEFAULT_MAX_STRIP_COLS;
      } else {
        state.maxStripCols = Math.min(49, Math.floor(state.maxStripCols / 7) * 7);
      }
      // screenRatio 必须落在合法档位里
      if (typeof state.screenRatio !== 'number' || state.screenRatio <= 0) {
        state.screenRatio = 1.0;
      } else {
        state.screenRatio = normalizeScreenRatio(state.screenRatio);
      }
      saveState();
    }
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('saveState failed:', e);
      }
    }

    // ========== Helpers ==========
    function pad2(n) { return String(n).padStart(2, '0'); }
    function dateStr(y, m, d) { return `${y}-${pad2(m+1)}-${pad2(d)}`; }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => (
        { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
      ));
    }
    function hexToRgba(hex, a) {
      const v = hex.replace('#','');
      const n = parseInt(v, 16);
      return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
    }
    function getProject(id) { return state.projects.find(p => p.id === id); }
    function getClicks(projectId, ds) {
      return (state.logs[projectId] || {})[ds] || 0;
    }
    function setClicks(projectId, ds, clicks) {
      if (!state.logs[projectId]) state.logs[projectId] = {};
      if (clicks <= 0) delete state.logs[projectId][ds];
      else state.logs[projectId][ds] = clicks;
      saveState();
    }
    function addMonths(y, m, delta) {
      const total = y * 12 + m + delta;
      return { y: Math.floor(total / 12), m: ((total % 12) + 12) % 12 };
    }
    // 一年中第几天（0-based，1/1 = 0）。用于 strip 中的位置
    function dayOfYear(y, m, d) {
      const start = new Date(y, 0, 1);
      const cur = new Date(y, m, d);
      return Math.round((cur - start) / 86400000);
    }

    // ========== Render: Sidebar ==========
    function renderProjects() {
      const list = document.getElementById('project-list');
      list.innerHTML = '';
      if (state.projects.length === 0) {
        list.innerHTML = '<li style="color:var(--text-faint);font-size:12px;padding:8px 10px;">还没有项目</li>';
        return;
      }
      state.projects.forEach(p => {
        const li = document.createElement('li');
        li.className = 'project-item' + (p.id === state.currentProjectId ? ' active' : '');
        li.innerHTML = `
          <span class="dot" style="background:${p.color}"></span>
          <span class="name">${escapeHtml(p.name)}</span>
          <button class="del" data-id="${p.id}" title="删除项目">×</button>
        `;
        li.addEventListener('click', (e) => {
          if (e.target.classList.contains('del')) return;
          state.currentProjectId = p.id;
          saveState();
          renderAll();
        });
        li.querySelector('.del').addEventListener('click', (e) => {
          e.stopPropagation();
          const proj = getProject(p.id);
          if (!proj) return;
          const hasLogs = state.logs[p.id] && Object.keys(state.logs[p.id]).length > 0;
          const msg = hasLogs
            ? `删除项目「${proj.name}」及其所有记录？此操作无法撤销。`
            : `删除项目「${proj.name}」？`;
          if (!confirm(msg)) return;
          delete state.logs[p.id];
          state.projects = state.projects.filter(x => x.id !== p.id);
          if (state.currentProjectId === p.id) {
            state.currentProjectId = state.projects[0]?.id || null;
          }
          saveState();
          renderAll();
        });
        list.appendChild(li);
      });
    }

    // ========== Render: Header (label + view toggle + containers) ==========
    function renderHeader() {
      document.querySelectorAll('#view-toggle button').forEach(b => {
        b.classList.toggle('active', b.dataset.view === state.viewMode);
      });

      let label = '';
      if (state.viewMode === 'month') {
        label = `${state.viewYear} 年 ${state.viewMonth + 1} 月`;
      } else if (state.viewMode === 'quarter') {
        const start = { y: state.viewYear, m: state.viewMonth };
        const end = addMonths(state.viewYear, state.viewMonth, 2);
        if (start.y === end.y) {
          label = `${start.y} 年 ${start.m + 1}–${end.m + 1} 月`;
        } else {
          label = `${start.y}.${start.m + 1} – ${end.y}.${end.m + 1}`;
        }
      } else {
        label = `${state.viewYear} 年`;
      }
      document.getElementById('month-label').textContent = label;

      const single = document.getElementById('single-view');
      const strip  = document.getElementById('strip-wrap');
      const isSingle = state.viewMode === 'month';
      single.style.display = isSingle ? '' : 'none';
      strip.style.display  = isSingle ? 'none' : '';
    }

    // ========== Render: Single Month ==========
    function renderSingleMonth() {
      const y = state.viewYear, m = state.viewMonth;
      const firstDay = new Date(y, m, 1).getDay();
      const lastDate = new Date(y, m + 1, 0).getDate();
      const now = new Date();
      const todayKey = dateStr(now.getFullYear(), now.getMonth(), now.getDate());
      const proj = getProject(state.currentProjectId);

      // 算月视图格子大小（固定 7 列，gap 6）—— 仅用于布局，字号 CSS 写死
      const MONTH_GAP = 6;
      const monthContainer = measureMonthWidth();
      const cellSize = Math.max(28, Math.floor((monthContainer - MONTH_GAP * 6) / 7));

      // v0.3.0：月视图字号 CSS 写死 14/14/10，不参与 strip 动态字号算法
      const weekdays = document.querySelector('.weekdays');
      weekdays.style.fontSize = '';  // 清掉 v0.2.5 设的内联字号，让 CSS 接管

      const daysEl = document.getElementById('days');
      daysEl.innerHTML = '';
      daysEl.style.fontSize = '';   // 同上

      for (let i = 0; i < firstDay; i++) {
        const blank = document.createElement('div');
        blank.className = 'day blank';
        daysEl.appendChild(blank);
      }

      for (let d = 1; d <= lastDate; d++) {
        const ds = dateStr(y, m, d);
        const cell = document.createElement('div');
        cell.className = 'day';
        cell.setAttribute('role', 'button');
        cell.setAttribute('tabindex', '0');
        cell.dataset.date = ds;
        cell.setAttribute('aria-label', `${y}年${m+1}月${d}日`);
        if (ds === todayKey) cell.classList.add('today');
        if (ds > todayKey) cell.classList.add('future');

        if (proj) {
          const clicks = getClicks(proj.id, ds);
          if (clicks > 0) {
            const alpha = clicks === 1 ? 0.28 : 0.85;
            cell.style.background = hexToRgba(proj.color, alpha);
            cell.classList.add('logged');
            cell.dataset.clicks = String(clicks);
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = clicks === 1 ? '半' : '整';
            // 月视图 badge 字号由 CSS 写死（10px），不再内联设置
            cell.appendChild(badge);
          }
        }

        const num = document.createElement('span');
        num.className = 'day-num';
        num.textContent = d;
        cell.appendChild(num);

        if (proj && ds <= todayKey) {
          cell.addEventListener('click', () => {
            const cur = getClicks(proj.id, ds);
            const next = (cur + 1) % 3;
            setClicks(proj.id, ds, next);
            renderCalendar();
            renderStats();
          });
        }
        daysEl.appendChild(cell);
      }
    }

    // ========== Render: Strip data (shared by quarter / year) ==========
    // 把一组连续月份流式展开成 strip 数据
    // 关键：只第一个月加前缀空对齐到对应周几，后续月份紧接上个月的最后一天 → 不会"跳星期"
    // cols 由调用方根据视口算出（7 的倍数）
    function buildStripData(months, cols) {
      const weeksPerRow = cols / 7;
      const weekdayLabels = [];
      for (let i = 0; i < weeksPerRow; i++) {
        for (let d = 0; d < 7; d++) {
          weekdayLabels.push(WEEKDAY_NAMES[d]);
        }
      }

      const cells = [];
      const m0 = months[0];
      const firstDow = new Date(m0.y, m0.m, 1).getDay();
      for (let i = 0; i < firstDow; i++) cells.push({ blank: true });

      for (const { y, m } of months) {
        const lastDate = new Date(y, m + 1, 0).getDate();
        for (let d = 1; d <= lastDate; d++) {
          cells.push({ y, m, d, date: dateStr(y, m, d), blank: false });
        }
      }
      cells.forEach((c, i) => { c.colIndex = i; });
      while (cells.length % cols !== 0) cells.push({ blank: true, colIndex: cells.length });

      return { cols, weekdayLabels, cells };
    }

    // 把 strip 数据渲染到 #strip-wrap（weekday row + day strip）
    // cols/cellSize/fontSize 由 calculateStripLayout + calcLabelFontSize 根据视口算出
    function renderStripEl(data, cellSize, stripClass) {
      const wrap = document.getElementById('strip-wrap');
      wrap.innerHTML = '';
      const now = new Date();
      const todayKey = dateStr(now.getFullYear(), now.getMonth(), now.getDate());
      const proj = getProject(state.currentProjectId);

      const gridStyle = `repeat(${data.cols}, ${cellSize}px)`;
      const labelFont = calcLabelFontSize(cellSize);
      const badgeFont = calcBadgeFontSize(cellSize);
      // v0.3.0：徽章渲染条件改为"能放下 4 个参考字号宽（≥ 56px）"，
      // 避免小格里"半"跟日期数字重叠
      const useBadgeStyle = shouldShowBadge(cellSize);

      // weekday row
      const wdRow = document.createElement('div');
      wdRow.className = 'weekday-row';
      wdRow.style.gridTemplateColumns = gridStyle;
      wdRow.style.fontSize = `${labelFont}px`;
      data.weekdayLabels.forEach((label, i) => {
        const span = document.createElement('span');
        const isWkn = (i % 7 === 0) || (i % 7 === 6);
        span.className = isWkn ? 'wkn' : 'we';
        span.textContent = label;
        wdRow.appendChild(span);
      });
      wrap.appendChild(wdRow);

      // day strip
      const strip = document.createElement('div');
      strip.className = 'day-strip' + (stripClass ? ' ' + stripClass : '');
      strip.style.gridTemplateColumns = gridStyle;
      strip.style.fontSize = `${labelFont}px`;
      data.cells.forEach(c => {
        strip.appendChild(buildStripCell(c, todayKey, proj, { useBadgeStyle, badgeFont }));
      });
      wrap.appendChild(strip);
    }

    // 季视图：1 块，3 个月连续流，列数由视口决定（7 的倍数）
    function renderQuarter() {
      const months = [];
      for (let i = 0; i < 3; i++) {
        const { y, m } = addMonths(state.viewYear, state.viewMonth, i);
        months.push({ y, m });
      }
      const { cols, cellSize } = calculateStripLayout(measureStripWidth());
      const data = buildStripData(months, cols);
      renderStripEl(data, cellSize);
    }

    // 年视图：独立组件，1 块，12 个月连续流，列数由视口决定
    function renderYear() {
      const months = [];
      for (let m = 0; m < 12; m++) months.push({ y: state.viewYear, m });
      const { cols, cellSize } = calculateStripLayout(measureStripWidth());
      const data = buildStripData(months, cols);
      renderStripEl(data, cellSize, 'year-strip');
    }

    function buildStripCell(cellData, todayKey, proj, opts) {
      const { useBadgeStyle, badgeFont } = opts || {};
      const cell = document.createElement('div');
      cell.className = 'strip-day';
      if (cellData.blank) {
        cell.classList.add('blank');
        return cell;
      }
      const { y, m, d, date: ds, colIndex } = cellData;
      cell.setAttribute('role', 'button');
      cell.setAttribute('tabindex', '0');
      cell.dataset.date = ds;
      cell.setAttribute('aria-label', `${y}年${m+1}月${d}日`);
      // 周末标记（按 cell 在 strip 中的实际列位置）
      const colInWeek = ((colIndex % 7) + 7) % 7;
      if (colInWeek === 0 || colInWeek === 6) cell.classList.add('wkn');
      if (ds === todayKey) cell.classList.add('today');
      if (ds > todayKey) cell.classList.add('future');

      let clicks = 0;
      if (proj) {
        clicks = getClicks(proj.id, ds);
        if (clicks > 0) {
          const alpha = clicks === 1 ? 0.28 : 0.85;
          cell.style.background = hexToRgba(proj.color, alpha);
          cell.classList.add('logged');
          cell.dataset.clicks = String(clicks);
        }
      }

      // 大格子（cellSize >= 56，见 shouldShowBadge）：切月视图样式（日期右上角、徽章左下角）
      if (useBadgeStyle) cell.classList.add('with-badge');

      const num = document.createElement('span');
      num.className = 'strip-day-num';
      num.textContent = d;
      cell.appendChild(num);

      // 大格子 + 有 log → 加 "半"/"整" 徽章
      if (useBadgeStyle && clicks > 0) {
        const badge = document.createElement('span');
        badge.className = 'strip-day-badge';
        badge.textContent = clicks === 1 ? '半' : '整';
        badge.style.fontSize = `${badgeFont}px`;
        cell.appendChild(badge);
      }

      if (proj && ds <= todayKey) {
        cell.addEventListener('click', () => {
          const cur = getClicks(proj.id, ds);
          const next = (cur + 1) % 3;
          setClicks(proj.id, ds, next);
          renderCalendar();
          renderStats();
        });
      }
      return cell;
    }

    function renderCalendar() {
      // v0.3.1：先按屏占比缩窄 main.panel，再算 cellSize（measureStripWidth/MonthWidth 读 .clientWidth）
      applyScreenRatio();
      if (state.viewMode === 'month') renderSingleMonth();
      else if (state.viewMode === 'quarter') renderQuarter();
      else if (state.viewMode === 'year') renderYear();
    }

    // v0.3.1：屏占比反向限制 main.panel 整体宽度
    //  - ratio = 1.0：清除 inline，恢复默认 grid (240px 1fr 280px)
    //  - ratio < 1：直接改 .app 的 grid-template-columns，把 1fr 换成精确 px 宽度
    //    这样 sidebar / stats 始终贴两侧固定 240 / 280，main 列 = frWidth * ratio
    //    main panel 内部再 margin auto 居中（在它自己的列里）。月视图 4k 下格子太大、季/年视图填充过满，都靠 main.panel 缩窄解决。
    // 之前（v0.3.0）的实现是给 main.panel 加 max-width + margin auto，但 .app 的 1fr 会被 sidebar/stats
    // 挤压到几乎 0（窄窗口 + 屏占比 < 1 时），main panel 直接消失 —— 改 .app grid 才能彻底控住。
    function applyScreenRatio() {
      const main = document.querySelector('main.panel');
      const app = main && main.parentElement;
      if (!main || !app) return;
      const ratio = state.screenRatio || 1.0;

      if (ratio >= 1.0) {
        // 恢复默认 grid + 清除 main panel inline
        app.style.gridTemplateColumns = '';
        main.style.maxWidth = '';
        main.style.marginLeft = '';
        main.style.marginRight = '';
        return;
      }

      // 屏占比 < 1：算 1fr 理论宽度（父容器 .app 宽 - sidebar 240 - stats 280 - 两个 gap 16 - 两个 padding 16）
      const appWidth = app.clientWidth;
      const SIDEBAR_W = 240, STATS_W = 280, GAP = 16, APP_PAD = 16 * 2;
      let frWidth = appWidth - SIDEBAR_W - STATS_W - GAP * 2 - APP_PAD;
      // v0.3.1 兜底：窗口太窄（frWidth < 1024）时屏占比失效，强制 100%
      // 否则 800px 窗口 + 屏占比 75% → mainW=168px → 季/年视图被压垮
      // 屏占比本来就是给 2k/4k 大屏设计的，窄屏本来就不需要缩
      if (frWidth < 1024) {
        app.style.gridTemplateColumns = '';
        main.style.maxWidth = '';
        main.style.marginLeft = '';
        main.style.marginRight = '';
        return;
      }
      const mainW = Math.floor(frWidth * ratio);

      // 直接改 .app 的 grid template columns：精确三列，sidebar/stats 不动
      app.style.gridTemplateColumns = `${SIDEBAR_W}px ${mainW}px ${STATS_W}px`;
      // main panel 自己也加 max-width 兜底（防止某些情况下 grid 1fr 又被挤压）+ 内部内容居中
      main.style.maxWidth = `${mainW}px`;
      main.style.marginLeft = 'auto';
      main.style.marginRight = 'auto';
    }

    // ========== Render: Stats ==========
    function sumLogs(logs) {
      let days = 0, half = 0;
      Object.values(logs).forEach(c => {
        if (c === 1) half++;
        else if (c === 2) days++;
      });
      return { days, half, total: days + half * 0.5 };
    }
    function renderStats() {
      const proj = getProject(state.currentProjectId);
      const titleEl = document.getElementById('stats-title');
      const body = document.getElementById('stats-body');

      if (!proj) {
        titleEl.textContent = '统计';
        body.innerHTML = '<p class="empty">先在左侧建一个项目 👈</p>';
        return;
      }
      titleEl.innerHTML = `<span class="dot" style="background:${proj.color}"></span>${escapeHtml(proj.name)}`;

      const all = sumLogs(state.logs[proj.id] || {});
      let monthLogs = {};
      if (state.viewMode === 'month') {
        const monthPrefix = `${state.viewYear}-${pad2(state.viewMonth + 1)}`;
        Object.entries(state.logs[proj.id] || {}).forEach(([k, v]) => {
          if (k.startsWith(monthPrefix)) monthLogs[k] = v;
        });
      } else {
        const count = VIEW_COUNT[state.viewMode];
        for (let i = 0; i < count; i++) {
          const { y, m } = addMonths(state.viewYear, state.viewMonth, i);
          const prefix = `${y}-${pad2(m + 1)}`;
          Object.entries(state.logs[proj.id] || {}).forEach(([k, v]) => {
            if (k.startsWith(prefix)) monthLogs[k] = v;
          });
        }
      }
      const m = sumLogs(monthLogs);

      const monthLabel = state.viewMode === 'month' ? '本月' :
                         state.viewMode === 'quarter' ? '本季度' : '本年';
      body.innerHTML = `
        <div class="stat-card">
          <div class="stat-label">${monthLabel}</div>
          <div class="stat-value">${m.total}<span class="unit">天</span></div>
          <div class="stat-sub">${m.days} 整天 · ${m.half} 半天</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">总计</div>
          <div class="stat-value">${all.total}<span class="unit">天</span></div>
          <div class="stat-sub">${all.days} 整天 · ${all.half} 半天</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">折合小时</div>
          <div class="stat-value">${(all.total * HOURS_PER_DAY).toFixed(1)}<span class="unit">h</span></div>
          <div class="stat-sub">按 1 天 = ${HOURS_PER_DAY}h 估算</div>
        </div>
      `;
    }

    function renderAll() {
      renderProjects();
      renderHeader();
      renderCalendar();
      renderStats();
    }

    // ========== Color Picker ==========
    function renderColorPicker() {
      const picker = document.getElementById('color-picker');
      picker.innerHTML = '';
      COLORS.forEach((c, i) => {
        const sw = document.createElement('button');
        sw.className = 'swatch' + (i === 0 ? ' selected' : '');
        sw.style.background = c;
        sw.dataset.color = c;
        sw.type = 'button';
        sw.addEventListener('click', () => {
          picker.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
          sw.classList.add('selected');
        });
        picker.appendChild(sw);
      });
    }
    function getSelectedColor() {
      const sel = document.querySelector('#color-picker .swatch.selected');
      return sel ? sel.dataset.color : COLORS[0];
    }

    // ========== Wire up ==========
    function shiftView(delta) {
      const step = VIEW_STEP[state.viewMode];
      const r = addMonths(state.viewYear, state.viewMonth, delta * step);
      state.viewYear = r.y;
      state.viewMonth = r.m;
      saveState();
      renderHeader();
      renderCalendar();
      renderStats();
    }
    function goToday() {
      const t = new Date();
      state.viewYear = t.getFullYear();
      // 锚定到当前视图的起点：年 → 1 月、季 → 季首月、月 → 今天
      if (state.viewMode === 'year') {
        state.viewMonth = 0;
      } else if (state.viewMode === 'quarter') {
        state.viewMonth = Math.floor(t.getMonth() / 3) * 3;
      } else {
        state.viewMonth = t.getMonth();
      }
      saveState();
      renderHeader();
      renderCalendar();
      renderStats();
    }
    function setViewMode(mode) {
      if (!VIEW_STEP[mode] || state.viewMode === mode) return;
      // 切换时把 viewMonth 对齐到当前视图的起点：本季 / 本年
      if (mode === 'quarter') {
        state.viewMonth = Math.floor(state.viewMonth / 3) * 3;
      } else if (mode === 'year') {
        state.viewMonth = 0;
      }
      state.viewMode = mode;
      saveState();
      renderAll();
    }
    function openModal() {
      document.getElementById('project-name').value = '';
      renderColorPicker();
      document.getElementById('project-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('project-name').focus(), 0);
    }
    function closeModal() {
      document.getElementById('project-modal').classList.add('hidden');
    }
    function confirmProject() {
      const name = document.getElementById('project-name').value.trim();
      if (!name) { alert('请输入项目名'); return; }
      if (state.projects.some(p => p.name === name)) {
        alert('已有同名项目，换一个？');
        return;
      }
      const id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      state.projects.push({ id, name, color: getSelectedColor() });
      state.currentProjectId = id;
      saveState();
      closeModal();
      renderAll();
    }

    // ========== Init ==========
    function init() {
      loadState();
      renderColorPicker();
      renderAll();

      // 视口缩放时重算布局（季/年视图列数和格子大小、月视图字号、屏占比 main.panel 宽度）
      let _resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(_resizeTimer);
        _resizeTimer = setTimeout(() => {
          renderCalendar();
        }, 100);
      });

      document.getElementById('prev-month').addEventListener('click', () => shiftView(-1));
      document.getElementById('next-month').addEventListener('click', () => shiftView(1));
      document.getElementById('today-btn').addEventListener('click', goToday);
      document.getElementById('view-toggle').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-view]');
        if (btn) setViewMode(btn.dataset.view);
      });

      // 设置按钮 + 菜单
      const settingsBtn = document.getElementById('settings-btn');
      const settingsMenu = document.getElementById('settings-menu');
      const maxColsInput = document.getElementById('max-cols-input');
      const screenRatioInput = document.getElementById('screen-ratio-input');
      maxColsInput.value = state.maxStripCols;
      // select 的 value 是字符串，要精确匹配（normalizeScreenRatio 已经吸附）
      screenRatioInput.value = String(state.screenRatio);
      settingsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        settingsMenu.classList.toggle('hidden');
      });
      document.addEventListener('click', (e) => {
        if (!settingsMenu.contains(e.target) && e.target !== settingsBtn) {
          settingsMenu.classList.add('hidden');
        }
      });
      maxColsInput.addEventListener('change', () => {
        // 向下取整到 7 的倍数
        let v = parseInt(maxColsInput.value, 10);
        if (isNaN(v) || v < 7) v = 7;
        if (v > 49) v = 49;
        v = Math.floor(v / 7) * 7;
        maxColsInput.value = v;
        state.maxStripCols = v;
        saveState();
        if (state.viewMode !== 'month') renderCalendar();
      });
      screenRatioInput.addEventListener('change', () => {
        // select 的 5 档都是合法值，直接 parseFloat
        const raw = parseFloat(screenRatioInput.value);
        const v = normalizeScreenRatio(raw);
        screenRatioInput.value = String(v);
        state.screenRatio = v;
        saveState();
        if (state.viewMode !== 'month') renderCalendar();
      });

      document.getElementById('add-project').addEventListener('click', openModal);
      document.getElementById('cancel-project').addEventListener('click', closeModal);
      document.getElementById('confirm-project').addEventListener('click', confirmProject);
      document.getElementById('project-name').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') confirmProject();
        if (e.key === 'Escape') closeModal();
      });
      document.getElementById('project-modal').addEventListener('click', (e) => {
        if (e.target.id === 'project-modal') closeModal();
      });
    }

    init();
  </script>
</body>
</html>
