<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计数日历</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --border: #e5e7eb;
      --text: #1f2937;
      --text-soft: #6b7280;
      --text-faint: #9ca3af;
      --accent: #3b82f6;
      --hover: #f3f4f6;
      --today-ring: #111827;
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    .app {
      display: grid;
      grid-template-columns: 240px 1fr 280px;
      gap: 16px;
      padding: 16px;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 16px;
      overflow: auto;
    }

    /* ===== Sidebar ===== */
    .sidebar { display: flex; flex-direction: column; }
    .sidebar h2 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-soft);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .project-list { list-style: none; margin: 0 0 12px; padding: 0; flex: 1; }
    .project-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }
    .project-item:hover { background: var(--hover); }
    .project-item.active { background: var(--hover); }
    .project-item .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255,255,255,1), 0 0 0 3px rgba(0,0,0,0.06);
    }
    .project-item .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .project-item .del {
      visibility: hidden;
      background: transparent;
      border: 0;
      color: var(--text-faint);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .project-item:hover .del { visibility: visible; }
    .project-item .del:hover { background: #fee2e2; color: #dc2626; }

    .btn {
      width: 100%;
      padding: 8px 12px;
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--text-soft);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); background: #eff6ff; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent);
    }
    .btn-primary:hover { background: #2563eb; border-color: #2563eb; color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-soft); }
    .btn-ghost:hover { background: var(--hover); color: var(--text); }

    /* ===== Calendar: header & view toggle ===== */
    .cal-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .nav-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .cal-header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cal-header button {
      padding: 4px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-soft);
      font-size: 14px;
      font-family: inherit;
    }
    .cal-header button:hover { background: var(--hover); color: var(--text); }

    .view-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .view-toggle button {
      padding: 4px 14px;
      background: var(--panel);
      border: 0;
      border-right: 1px solid var(--border);
      color: var(--text-soft);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      min-width: 48px;
    }
    .view-toggle button:last-child { border-right: 0; }
    .view-toggle button:hover { background: var(--hover); color: var(--text); }
    .view-toggle button.active {
      background: var(--accent);
      color: #fff;
    }

    /* ===== Calendar: single month ===== */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 6px;
    }
    .weekdays span {
      text-align: center;
      font-size: 12px;
      color: var(--text-faint);
      padding: 6px 0;
      font-weight: 500;
    }
    .weekdays span:nth-child(1),
    .weekdays span:nth-child(7) { color: #ef4444; }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .day {
      aspect-ratio: 1 / 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 6px 8px;
      font-size: 13px;
      color: var(--text-soft);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      position: relative;
      overflow: hidden;
    }
    .day.blank { background: transparent; border: 0; cursor: default; }
    .day:hover:not(.blank):not(.future) {
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .day.future { cursor: not-allowed; opacity: 0.5; }
    .day.logged { color: #fff; font-weight: 600; text-shadow: 0 1px 1px rgba(0,0,0,0.15); }
    .day.logged[data-clicks="1"] { color: var(--text); text-shadow: none; }
    .day.today { box-shadow: 0 0 0 2px var(--today-ring) inset; }
    .day-num { position: relative; z-index: 1; }
    .day .badge {
      position: absolute;
      bottom: 4px;
      left: 4px;
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(255,255,255,0.35);
      color: inherit;
    }

    /* ===== Calendar: continuous strip (quarter / year) ===== */
    .strip-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .strip-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 6px 6px;
    }
    .strip-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      padding: 0 4px;
    }
    .strip-block-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }
    .strip-block-name .year-tag {
      color: var(--text-faint);
      font-weight: 400;
      margin-left: 4px;
      font-size: 11px;
    }
    .strip-block-name .blank-tag {
      color: var(--text-faint);
      font-weight: 400;
      margin-left: 8px;
      font-size: 11px;
    }
    .weekday-row {
      display: grid;
      grid-template-columns: repeat(var(--cols, 21), minmax(0, 1fr));
      gap: 2px;
      font-size: 9px;
      color: var(--text-faint);
      text-align: center;
      margin-bottom: 3px;
    }
    .weekday-row span { padding: 1px 0; }
    .weekday-row span.we { color: #ef4444; }  /* 一/二/三/四/五 默认 */
    .weekday-row span.wkn { color: #ef4444; } /* 日、六 */

    .day-strip {
      display: grid;
      grid-template-columns: repeat(var(--cols, 21), minmax(0, 1fr));
      gap: 2px;
    }
    .strip-day {
      aspect-ratio: 1 / 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: var(--text-soft);
      cursor: pointer;
      position: relative;
      min-width: 0;
    }
    .strip-day.blank { background: transparent; border: 0; cursor: default; }
    .strip-day.future { cursor: not-allowed; opacity: 0.4; }
    .strip-day.logged { color: #fff; font-weight: 600; }
    .strip-day.logged[data-clicks="1"] { color: var(--text); font-weight: 400; }
    .strip-day.today { box-shadow: 0 0 0 1.5px var(--today-ring) inset; }
    .strip-day-num { line-height: 1; }

    /* 块之间用空白区分（每块是一个 strip 块） */

    /* ===== Stats ===== */
    .stats h2 {
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stats h2 .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(255,255,255,1), 0 0 0 3px rgba(0,0,0,0.06);
    }
    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .stat-label { font-size: 12px; color: var(--text-faint); margin-bottom: 4px; }
    .stat-value { font-size: 24px; font-weight: 600; }
    .stat-value .unit { font-size: 13px; color: var(--text-soft); margin-left: 4px; font-weight: 400; }
    .stat-sub { font-size: 12px; color: var(--text-soft); margin-top: 2px; }

    .empty { color: var(--text-faint); text-align: center; padding: 32px 8px; }

    /* ===== Modal ===== */
    .modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal.hidden { display: none; }
    .modal-content {
      background: var(--panel);
      border-radius: 12px;
      padding: 20px;
      width: 320px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }
    .modal-content h3 { margin: 0 0 16px; font-size: 16px; }
    .modal-content label {
      display: block;
      font-size: 12px;
      color: var(--text-soft);
      margin-bottom: 12px;
    }
    .modal-content input[type="text"] {
      width: 100%;
      margin-top: 4px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .modal-content input[type="text"]:focus { border-color: var(--accent); }
    .color-picker {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    .swatch {
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
    }
    .swatch.selected { border-color: var(--text); transform: scale(1.1); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-actions button { width: auto; padding: 6px 14px; }

    /* ===== Responsive ===== */
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; height: auto; }
      .panel { max-height: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel sidebar">
      <h2>项目</h2>
      <ul class="project-list" id="project-list"></ul>
      <button class="btn" id="add-project">+ 新建项目</button>
    </aside>

    <main class="panel">
      <div class="cal-header">
        <div class="nav-group">
          <button id="prev-month" title="上一步">‹</button>
          <h1 id="month-label"></h1>
          <button id="next-month" title="下一步">›</button>
          <button id="today-btn">今天</button>
        </div>
        <div class="view-toggle" id="view-toggle" role="tablist">
          <button data-view="month"   title="月视图">月</button>
          <button data-view="quarter" title="季度视图（3 个月）">季</button>
          <button data-view="year"    title="年视图（12 个月）">年</button>
        </div>
      </div>

      <!-- 月视图 -->
      <div id="single-view">
        <div class="weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div class="days" id="days"></div>
      </div>

      <!-- 季/年视图：连续 strip 布局 -->
      <div class="strip-wrap" id="strip-wrap" style="display:none"></div>
    </main>

    <section class="panel stats">
      <h2 id="stats-title">统计</h2>
      <div id="stats-body"></div>
    </section>
  </div>

  <div class="modal hidden" id="project-modal">
    <div class="modal-content">
      <h3>新建项目</h3>
      <label>项目名称
        <input type="text" id="project-name" maxlength="20" placeholder="例如：学习、跑步">
      </label>
      <div class="color-picker" id="color-picker"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancel-project">取消</button>
        <button class="btn btn-primary" id="confirm-project">确定</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    // ========== Config ==========
    const STORAGE_KEY = 'count_calendar_v2';
    const HOURS_PER_DAY = 8;
    const COLORS = [
      '#ef4444', '#f59e0b', '#eab308', '#10b981',
      '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899'
    ];
    const DEFAULT_PROJECTS = [
      { id: 'p_default_study', name: '学习', color: '#3b82f6' },
      { id: 'p_default_sport', name: '运动', color: '#10b981' },
      { id: 'p_default_work',  name: '工作', color: '#f59e0b' }
    ];
    const VIEW_STEP  = { month: 1, quarter: 3, year: 12 };
    const VIEW_COUNT = { month: 1, quarter: 3, year: 12 };
    // 大视图：每行几周（7 的倍数）— 季视图 3 周 / 年视图 4 周
    const WEEKS_PER_ROW = { month: 1, quarter: 3, year: 4 };
    const WEEKDAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];

    // ========== State ==========
    let state = {
      projects: [],
      currentProjectId: null,
      logs: {},
      viewYear: null,
      viewMonth: null,
      viewMode: 'month'
    };

    // ========== Storage ==========
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = Object.assign(state, parsed);
        }
      } catch (e) {
        console.warn('loadState failed:', e);
      }
      if (!Array.isArray(state.projects) || state.projects.length === 0) {
        state.projects = DEFAULT_PROJECTS.slice();
      }
      if (!state.currentProjectId && state.projects[0]) {
        state.currentProjectId = state.projects[0].id;
      }
      if (!state.logs || typeof state.logs !== 'object') state.logs = {};
      const now = new Date();
      if (state.viewYear == null || state.viewYear < 1900) state.viewYear = now.getFullYear();
      if (state.viewMonth == null || state.viewMonth < 0 || state.viewMonth > 11) state.viewMonth = now.getMonth();
      if (!VIEW_STEP[state.viewMode]) state.viewMode = 'month';
      saveState();
    }
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('saveState failed:', e);
      }
    }

    // ========== Helpers ==========
    function pad2(n) { return String(n).padStart(2, '0'); }
    function dateStr(y, m, d) { return `${y}-${pad2(m+1)}-${pad2(d)}`; }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => (
        { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
      ));
    }
    function hexToRgba(hex, a) {
      const v = hex.replace('#','');
      const n = parseInt(v, 16);
      return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
    }
    function getProject(id) { return state.projects.find(p => p.id === id); }
    function getClicks(projectId, ds) {
      return (state.logs[projectId] || {})[ds] || 0;
    }
    function setClicks(projectId, ds, clicks) {
      if (!state.logs[projectId]) state.logs[projectId] = {};
      if (clicks <= 0) delete state.logs[projectId][ds];
      else state.logs[projectId][ds] = clicks;
      saveState();
    }
    function addMonths(y, m, delta) {
      const total = y * 12 + m + delta;
      return { y: Math.floor(total / 12), m: ((total % 12) + 12) % 12 };
    }
    // 一年中第几天（0-based，1/1 = 0）。用于 strip 中的位置
    function dayOfYear(y, m, d) {
      const start = new Date(y, 0, 1);
      const cur = new Date(y, m, d);
      return Math.round((cur - start) / 86400000);
    }

    // ========== Render: Sidebar ==========
    function renderProjects() {
      const list = document.getElementById('project-list');
      list.innerHTML = '';
      if (state.projects.length === 0) {
        list.innerHTML = '<li style="color:var(--text-faint);font-size:12px;padding:8px 10px;">还没有项目</li>';
        return;
      }
      state.projects.forEach(p => {
        const li = document.createElement('li');
        li.className = 'project-item' + (p.id === state.currentProjectId ? ' active' : '');
        li.innerHTML = `
          <span class="dot" style="background:${p.color}"></span>
          <span class="name">${escapeHtml(p.name)}</span>
          <button class="del" data-id="${p.id}" title="删除项目">×</button>
        `;
        li.addEventListener('click', (e) => {
          if (e.target.classList.contains('del')) return;
          state.currentProjectId = p.id;
          saveState();
          renderAll();
        });
        li.querySelector('.del').addEventListener('click', (e) => {
          e.stopPropagation();
          const proj = getProject(p.id);
          if (!proj) return;
          const hasLogs = state.logs[p.id] && Object.keys(state.logs[p.id]).length > 0;
          const msg = hasLogs
            ? `删除项目「${proj.name}」及其所有记录？此操作无法撤销。`
            : `删除项目「${proj.name}」？`;
          if (!confirm(msg)) return;
          delete state.logs[p.id];
          state.projects = state.projects.filter(x => x.id !== p.id);
          if (state.currentProjectId === p.id) {
            state.currentProjectId = state.projects[0]?.id || null;
          }
          saveState();
          renderAll();
        });
        list.appendChild(li);
      });
    }

    // ========== Render: Header (label + view toggle + containers) ==========
    function renderHeader() {
      document.querySelectorAll('#view-toggle button').forEach(b => {
        b.classList.toggle('active', b.dataset.view === state.viewMode);
      });

      let label = '';
      if (state.viewMode === 'month') {
        label = `${state.viewYear} 年 ${state.viewMonth + 1} 月`;
      } else if (state.viewMode === 'quarter') {
        const start = { y: state.viewYear, m: state.viewMonth };
        const end = addMonths(state.viewYear, state.viewMonth, 2);
        if (start.y === end.y) {
          label = `${start.y} 年 ${start.m + 1}–${end.m + 1} 月`;
        } else {
          label = `${start.y}.${start.m + 1} – ${end.y}.${end.m + 1}`;
        }
      } else {
        label = `${state.viewYear} 年`;
      }
      document.getElementById('month-label').textContent = label;

      const single = document.getElementById('single-view');
      const strip  = document.getElementById('strip-wrap');
      const isSingle = state.viewMode === 'month';
      single.style.display = isSingle ? '' : 'none';
      strip.style.display  = isSingle ? 'none' : '';
    }

    // ========== Render: Single Month ==========
    function renderSingleMonth() {
      const y = state.viewYear, m = state.viewMonth;
      const firstDay = new Date(y, m, 1).getDay();
      const lastDate = new Date(y, m + 1, 0).getDate();
      const now = new Date();
      const todayKey = dateStr(now.getFullYear(), now.getMonth(), now.getDate());
      const proj = getProject(state.currentProjectId);

      const daysEl = document.getElementById('days');
      daysEl.innerHTML = '';

      for (let i = 0; i < firstDay; i++) {
        const blank = document.createElement('div');
        blank.className = 'day blank';
        daysEl.appendChild(blank);
      }

      for (let d = 1; d <= lastDate; d++) {
        const ds = dateStr(y, m, d);
        const cell = document.createElement('div');
        cell.className = 'day';
        cell.setAttribute('role', 'button');
        cell.setAttribute('tabindex', '0');
        cell.dataset.date = ds;
        cell.setAttribute('aria-label', `${y}年${m+1}月${d}日`);
        if (ds === todayKey) cell.classList.add('today');
        if (ds > todayKey) cell.classList.add('future');

        if (proj) {
          const clicks = getClicks(proj.id, ds);
          if (clicks > 0) {
            const alpha = clicks === 1 ? 0.28 : 0.85;
            cell.style.background = hexToRgba(proj.color, alpha);
            cell.classList.add('logged');
            cell.dataset.clicks = String(clicks);
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = clicks === 1 ? '半' : '整';
            cell.appendChild(badge);
          }
        }

        const num = document.createElement('span');
        num.className = 'day-num';
        num.textContent = d;
        cell.appendChild(num);

        if (proj && ds <= todayKey) {
          cell.addEventListener('click', () => {
            const cur = getClicks(proj.id, ds);
            const next = (cur + 1) % 3;
            setClicks(proj.id, ds, next);
            renderCalendar();
            renderStats();
          });
        }
        daysEl.appendChild(cell);
      }
    }

    // ========== Render: Continuous Strip (quarter / year) ==========
    // 把一组连续月份流式展开成 strip
    // 每个月：1号用前缀空对齐到对应周几
    // 一行 weeksPerRow 周（7 × weeksPerRow 列），自动换行
    function buildStripBlock(months, weeksPerRow) {
      // months: [{y, m}, ...]
      // 返回 strip 数据：{ cols, weekdayRow: [7*N], cells: [{y,m,d,blank,date,isMonthStart}...] }
      const cols = 7 * weeksPerRow;
      const weekdayRow = [];
      for (let i = 0; i < weeksPerRow; i++) {
        for (let d = 0; d < 7; d++) {
          weekdayRow.push(d === 0 || d === 6 ? 'wkn' : 'we');
        }
      }
      // weekday 标签文本（每 7 一组，每月 7 个：日一二三四五六）
      // 我们已经在 CSS 用 .we/.wkn class 表示类型，不在这里放文字
      // 不过用户要"日 一 二 三 四 五 六"显示，所以这里我们放纯文本
      const weekdayLabels = [];
      for (let i = 0; i < weeksPerRow; i++) {
        for (let d = 0; d < 7; d++) {
          weekdayLabels.push(WEEKDAY_NAMES[d]);
        }
      }

      const cells = [];
      for (const { y, m } of months) {
        const firstDow = new Date(y, m, 1).getDay();  // 0=日
        const lastDate = new Date(y, m + 1, 0).getDate();
        for (let i = 0; i < firstDow; i++) {
          cells.push({ blank: true });
        }
        for (let d = 1; d <= lastDate; d++) {
          cells.push({ y, m, d, date: dateStr(y, m, d), blank: false });
        }
      }
      // 末尾补空到 cols 倍数
      while (cells.length % cols !== 0) cells.push({ blank: true });

      return { cols, weekdayLabels, cells, months };
    }

    function buildStripCell(cellData, todayKey, proj) {
      const cell = document.createElement('div');
      cell.className = 'strip-day';
      if (cellData.blank) {
        cell.classList.add('blank');
        return cell;
      }
      const { y, m, d, date: ds } = cellData;
      cell.setAttribute('role', 'button');
      cell.setAttribute('tabindex', '0');
      cell.dataset.date = ds;
      cell.setAttribute('aria-label', `${y}年${m+1}月${d}日`);
      if (ds === todayKey) cell.classList.add('today');
      if (ds > todayKey) cell.classList.add('future');

      if (proj) {
        const clicks = getClicks(proj.id, ds);
        if (clicks > 0) {
          const alpha = clicks === 1 ? 0.28 : 0.85;
          cell.style.background = hexToRgba(proj.color, alpha);
          cell.classList.add('logged');
          cell.dataset.clicks = String(clicks);
        }
      }
      const num = document.createElement('span');
      num.className = 'strip-day-num';
      num.textContent = d;
      cell.appendChild(num);

      if (proj && ds <= todayKey) {
        cell.addEventListener('click', () => {
          const cur = getClicks(proj.id, ds);
          const next = (cur + 1) % 3;
          setClicks(proj.id, ds, next);
          renderCalendar();
          renderStats();
        });
      }
      return cell;
    }

    function renderStrip() {
      const wrap = document.getElementById('strip-wrap');
      wrap.innerHTML = '';
      const count = VIEW_COUNT[state.viewMode];
      const weeksPerRow = WEEKS_PER_ROW[state.viewMode];
      const now = new Date();
      const todayKey = dateStr(now.getFullYear(), now.getMonth(), now.getDate());
      const proj = getProject(state.currentProjectId);

      // 决定每个月"标签块"
      // 季视图：1 块（3 个月一起）
      // 年视图：按 4 个月一组（每行 4 月）？或按 3 个月一组？
      //  为了视觉清晰，按 monthsPerBlock 分组：季视图全 1 块，年视图 3 块（每 4 月一块）
      const monthsPerBlock = state.viewMode === 'quarter' ? 3 : 4;

      const allMonths = [];
      for (let i = 0; i < count; i++) {
        const { y, m } = addMonths(state.viewYear, state.viewMonth, i);
        allMonths.push({ y, m });
      }
      const blocks = [];
      for (let i = 0; i < allMonths.length; i += monthsPerBlock) {
        blocks.push(allMonths.slice(i, i + monthsPerBlock));
      }

      blocks.forEach((blockMonths, blockIdx) => {
        const block = document.createElement('div');
        block.className = 'strip-block';

        // 块标题：months[0] 范围
        const m0 = blockMonths[0];
        const mN = blockMonths[blockMonths.length - 1];
        const header = document.createElement('div');
        header.className = 'strip-block-header';
        const yearTag0 = (m0.y !== state.viewYear) ? `<span class="year-tag">${m0.y}</span>` : '';
        const yearTagN = (mN.y !== m0.y) ? `<span class="year-tag">${mN.y}</span>` : '';
        const rangeLabel = (m0.y === mN.y)
          ? `${m0.m + 1}–${mN.m + 1} 月${yearTag0}`
          : `${m0.m + 1} 月${yearTag0} – ${mN.m + 1} 月${yearTagN}`;
        const blankInfo = `<span class="blank-tag">共 ${blockMonths.length} 个月 · ${weeksPerRow} 周/行</span>`;
        header.innerHTML = `
          <span class="strip-block-name">${rangeLabel}</span>
          ${blankInfo}
        `;
        block.appendChild(header);

        const data = buildStripBlock(blockMonths, weeksPerRow);
        // weekday row
        const wdRow = document.createElement('div');
        wdRow.className = 'weekday-row';
        wdRow.style.setProperty('--cols', data.cols);
        data.weekdayLabels.forEach((label, i) => {
          const span = document.createElement('span');
          // class 用 we/wkn 标颜色（CSS 中 wkn 红）
          const isWkn = (i % 7 === 0) || (i % 7 === 6);
          span.className = isWkn ? 'wkn' : 'we';
          span.textContent = label;
          wdRow.appendChild(span);
        });
        block.appendChild(wdRow);

        // day strip
        const strip = document.createElement('div');
        strip.className = 'day-strip';
        strip.style.setProperty('--cols', data.cols);
        data.cells.forEach(c => {
          strip.appendChild(buildStripCell(c, todayKey, proj));
        });
        block.appendChild(strip);

        wrap.appendChild(block);
      });
    }

    function renderCalendar() {
      if (state.viewMode === 'month') renderSingleMonth();
      else renderStrip();
    }

    // ========== Render: Stats ==========
    function sumLogs(logs) {
      let days = 0, half = 0;
      Object.values(logs).forEach(c => {
        if (c === 1) half++;
        else if (c === 2) days++;
      });
      return { days, half, total: days + half * 0.5 };
    }
    function renderStats() {
      const proj = getProject(state.currentProjectId);
      const titleEl = document.getElementById('stats-title');
      const body = document.getElementById('stats-body');

      if (!proj) {
        titleEl.textContent = '统计';
        body.innerHTML = '<p class="empty">先在左侧建一个项目 👈</p>';
        return;
      }
      titleEl.innerHTML = `<span class="dot" style="background:${proj.color}"></span>${escapeHtml(proj.name)}`;

      const all = sumLogs(state.logs[proj.id] || {});
      let monthLogs = {};
      if (state.viewMode === 'month') {
        const monthPrefix = `${state.viewYear}-${pad2(state.viewMonth + 1)}`;
        Object.entries(state.logs[proj.id] || {}).forEach(([k, v]) => {
          if (k.startsWith(monthPrefix)) monthLogs[k] = v;
        });
      } else {
        const count = VIEW_COUNT[state.viewMode];
        for (let i = 0; i < count; i++) {
          const { y, m } = addMonths(state.viewYear, state.viewMonth, i);
          const prefix = `${y}-${pad2(m + 1)}`;
          Object.entries(state.logs[proj.id] || {}).forEach(([k, v]) => {
            if (k.startsWith(prefix)) monthLogs[k] = v;
          });
        }
      }
      const m = sumLogs(monthLogs);

      const monthLabel = state.viewMode === 'month' ? '本月' :
                         state.viewMode === 'quarter' ? '本季度' : '本年';
      body.innerHTML = `
        <div class="stat-card">
          <div class="stat-label">${monthLabel}</div>
          <div class="stat-value">${m.total}<span class="unit">天</span></div>
          <div class="stat-sub">${m.days} 整天 · ${m.half} 半天</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">总计</div>
          <div class="stat-value">${all.total}<span class="unit">天</span></div>
          <div class="stat-sub">${all.days} 整天 · ${all.half} 半天</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">折合小时</div>
          <div class="stat-value">${(all.total * HOURS_PER_DAY).toFixed(1)}<span class="unit">h</span></div>
          <div class="stat-sub">按 1 天 = ${HOURS_PER_DAY}h 估算</div>
        </div>
      `;
    }

    function renderAll() {
      renderProjects();
      renderHeader();
      renderCalendar();
      renderStats();
    }

    // ========== Color Picker ==========
    function renderColorPicker() {
      const picker = document.getElementById('color-picker');
      picker.innerHTML = '';
      COLORS.forEach((c, i) => {
        const sw = document.createElement('button');
        sw.className = 'swatch' + (i === 0 ? ' selected' : '');
        sw.style.background = c;
        sw.dataset.color = c;
        sw.type = 'button';
        sw.addEventListener('click', () => {
          picker.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
          sw.classList.add('selected');
        });
        picker.appendChild(sw);
      });
    }
    function getSelectedColor() {
      const sel = document.querySelector('#color-picker .swatch.selected');
      return sel ? sel.dataset.color : COLORS[0];
    }

    // ========== Wire up ==========
    function shiftView(delta) {
      const step = VIEW_STEP[state.viewMode];
      const r = addMonths(state.viewYear, state.viewMonth, delta * step);
      state.viewYear = r.y;
      state.viewMonth = r.m;
      saveState();
      renderHeader();
      renderCalendar();
      renderStats();
    }
    function goToday() {
      const t = new Date();
      state.viewYear = t.getFullYear();
      state.viewMonth = t.getMonth();
      saveState();
      renderHeader();
      renderCalendar();
      renderStats();
    }
    function setViewMode(mode) {
      if (!VIEW_STEP[mode] || state.viewMode === mode) return;
      state.viewMode = mode;
      saveState();
      renderAll();
    }
    function openModal() {
      document.getElementById('project-name').value = '';
      renderColorPicker();
      document.getElementById('project-modal').classList.remove('hidden');
      setTimeout(() => document.getElementById('project-name').focus(), 0);
    }
    function closeModal() {
      document.getElementById('project-modal').classList.add('hidden');
    }
    function confirmProject() {
      const name = document.getElementById('project-name').value.trim();
      if (!name) { alert('请输入项目名'); return; }
      if (state.projects.some(p => p.name === name)) {
        alert('已有同名项目，换一个？');
        return;
      }
      const id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      state.projects.push({ id, name, color: getSelectedColor() });
      state.currentProjectId = id;
      saveState();
      closeModal();
      renderAll();
    }

    // ========== Init ==========
    function init() {
      loadState();
      renderColorPicker();
      renderAll();

      document.getElementById('prev-month').addEventListener('click', () => shiftView(-1));
      document.getElementById('next-month').addEventListener('click', () => shiftView(1));
      document.getElementById('today-btn').addEventListener('click', goToday);
      document.getElementById('view-toggle').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-view]');
        if (btn) setViewMode(btn.dataset.view);
      });
      document.getElementById('add-project').addEventListener('click', openModal);
      document.getElementById('cancel-project').addEventListener('click', closeModal);
      document.getElementById('confirm-project').addEventListener('click', confirmProject);
      document.getElementById('project-name').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') confirmProject();
        if (e.key === 'Escape') closeModal();
      });
      document.getElementById('project-modal').addEventListener('click', (e) => {
        if (e.target.id === 'project-modal') closeModal();
      });
    }

    init();
  </script>
</body>
</html>
